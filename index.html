<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Med Calendar">
<meta name="theme-color" content="#5a4fcf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Medication Calendar</title>
<style>
/* Layout: medication buttons across the top, full-width month grid below, add/edit form opens between them. */
:root {
  --bg: #ece8fb;
  --bg-grad: linear-gradient(160deg, #5a4fcf 0%, #8a63d2 34%, #c97fb8 68%, #f2a98a 100%);
  --on-bg: #ffffff;
  --bg-end: #f2a98a;
  --on-bg-muted: rgba(255,255,255,.82);
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #667089;
  --line: #dde2ec;
  --accent: #3a4fd6;
  --today: #e7ebff;
  --chip: #eef1f7;
  --danger: #c23b3b;
  --font-display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141226; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%); --bg-end: #4a2445; --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75); --surface: #1b202b; --ink: #e8ebf3; --muted: #98a1b8; --line: #2c3342;
    --accent: #8d9cff; --today: #262e4a; --chip: #252b38; --danger: #ff7b7b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141226; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%); --bg-end: #4a2445; --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75); --surface: #1b202b; --ink: #e8ebf3; --muted: #98a1b8; --line: #2c3342;
  --accent: #8d9cff; --today: #262e4a; --chip: #252b38; --danger: #ff7b7b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
html { background: var(--bg-end); min-height: 100%; }
body { background: var(--bg-grad); background-color: var(--bg); min-height: 100vh; }
header h1 { color: var(--on-bg); }
header .sub, .hint, .backup > span, .status { color: var(--on-bg-muted) !important; }
.hint b { color: var(--on-bg) !important; }
.legend .tool { background: rgba(255,255,255,.18) !important; color: var(--on-bg) !important; border-color: rgba(255,255,255,.55) !important; }
.legend .tool.on { background: var(--surface) !important; color: var(--accent) !important; border-style: solid !important; }
.nav button, .backup .btn { box-shadow: 0 2px 6px rgb(30 20 80 / .18); border-color: transparent; }
.legend > button.med, .cal, .editor, .notebox { box-shadow: 0 4px 16px rgb(30 20 80 / .16); border-color: transparent; }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-block: calc(16px + env(safe-area-inset-top)) calc(32px + env(safe-area-inset-bottom)); }
body { -webkit-tap-highlight-color: transparent; }
@media (max-width: 520px) {
  .legend > button { padding: 6px 10px 6px 6px; font-size: 12.5px; }
  .legend .lg i { font-size: 11px; }
  .sub { font-size: 13.5px; }
  .notebox .spacer { visibility: hidden; }
}
.backup { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
.backup .btn { font-size: 13px; padding: 6px 14px; }
.backup label.btn { display: inline-block; }
.backup input { display: none; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; }
.nav button:hover { border-color: var(--accent); }
.nav .today-btn { width: auto; border-radius: 999px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 600; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.legend > button { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; text-align: left; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 8px; cursor: pointer; }
.legend > button.med:hover { border-color: var(--mc); }
.legend > button.med[aria-pressed="true"] { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 14%, var(--surface)); box-shadow: 0 0 0 2px var(--mc); }
.legend.editing > button.med { border-style: dashed; }
.legend .lg { display: flex; flex-direction: column; line-height: 1.25; }
.legend .lg b { font-weight: 600; }
.legend .lg i { font-style: normal; color: var(--muted); font-size: 12px; }
.legend .tool { border-style: dashed; color: var(--muted); font-weight: 600; padding: 8px 14px; }
.legend .tool:hover { color: var(--ink); border-color: var(--accent); }
.legend .tool.on { border-style: solid; border-color: var(--accent); color: var(--accent); }
.hint { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; min-height: 1.3em; }
.hint b { color: var(--ink); }

.editor { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: grid; gap: 14px; }
.editor h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
.seg button { border: none; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.nick { display: inline-block; font-weight: 800; font-size: 11px; line-height: 1; letter-spacing: .02em; padding: 3px 4px; border-radius: 5px; background: color-mix(in srgb, currentColor 13%, transparent); white-space: nowrap; }
.legend .nick { font-size: 13px; padding: 5px 6px; min-width: 24px; text-align: center; }
.edit-actions .preview .nick { font-size: 14px; padding: 5px 7px; }
@media (max-width: 520px) { .icons .nick { font-size: 9.5px; padding: 2px 3px; } }
.todaycard { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 4px 16px rgb(30 20 80 / .16); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.todaycard h2 { font-family: var(--font-display); font-size: 1rem; margin: 0 6px 0 0; }
.todaycard .none { color: var(--muted); font-size: 13.5px; }
.todaycard button { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--mc); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 7px; font: inherit; font-size: 13px; cursor: pointer; }
.todaycard button svg { width: 20px; height: 20px; }
.todaycard button.done { border-style: solid; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); }
.todaycard button.done .st { color: var(--mc); font-weight: 700; }
.todaycard .st { color: var(--muted); font-size: 12px; }
.gw { display: inline-flex; align-items: center; border-radius: 5px; outline: 1.5px dashed currentColor; outline-offset: 1px; opacity: .5; }
.gw.missed { outline-color: var(--danger); opacity: .6; }
.key { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--on-bg-muted); }
.key .gw { color: var(--on-bg); margin-left: 6px; }
.key .gw svg { width: 16px; height: 16px; }
.sched { display: grid; gap: 12px; padding: 12px; border-radius: 12px; background: var(--chip); }
.field select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); }
.field input[type=date], .field input[type=time] { min-height: 38px; }
.daypick { display: flex; flex-wrap: wrap; gap: 6px; }
.daypick button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.cyc { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.remrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.remrow input[type=time] { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font: inherit; background: var(--surface); color: var(--ink); }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.field input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.picks button { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.picks button svg { width: 26px; height: 26px; }
.picks button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.picks .sw { width: 32px; height: 32px; border-radius: 50%; }
.edit-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.edit-actions .preview { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; font-weight: 600; }
.edit-actions .preview svg { width: 30px; height: 30px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.confirm { background: var(--danger); color: var(--surface); }
.err { color: var(--danger); font-size: 13px; }

.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow div { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 4px 0 8px; font-weight: 600; }
.day { min-height: 92px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:hover { background: var(--chip); }
.day.blank { cursor: default; visibility: hidden; }
.day .n { font-family: var(--font-display); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.day.today .n { background: var(--accent); color: var(--surface); }
.icons { display: flex; flex-wrap: wrap; gap: 3px; }
.icons svg { width: 20px; height: 20px; }
@media (max-width: 520px) {
  .day { min-height: 70px; padding: 4px; }
  .icons svg { width: 15px; height: 15px; }
  .icons { gap: 2px; }
}
.day .note { display: flex; align-items: flex-start; gap: 3px; font-size: 11px; line-height: 1.25; color: var(--muted); min-width: 0; }
.day .note svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }
.day .note span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
@media (max-width: 520px) { .day .note span { display: none; } }
.notebox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: grid; gap: 10px; }
.notebox h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
.notebox textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); resize: vertical; }
.notebox textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.notebox .edit-actions .spacer { margin-right: auto; font-size: 12.5px; color: var(--muted); }
.status { font-size: 12.5px; color: var(--muted); margin-top: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="monthTitle">Medication Calendar</h1>
      <p class="sub">Pick a medication, then tap each day you took it. Tap again to remove it.</p>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="todayBtn" class="today-btn">Today</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <section class="todaycard" id="todayCard" aria-label="Due today"></section>

  <div class="legend" id="legend" role="toolbar" aria-label="Medications"></div>
  <p class="hint" id="hint"></p>

  <section class="editor" id="editor" hidden aria-labelledby="edTitle">
    <h2 id="edTitle">Add a medication</h2>
    <div class="row2">
      <label class="field"><span>Name</span><input id="edName" maxlength="40" placeholder="e.g. Progesterone"></label>
      <label class="field"><span>Nickname (up to 6 letters)</span><input id="edNick" maxlength="6" placeholder="e.g. TC, Zep" autocapitalize="characters"></label>
      <div class="field"><span>Show on calendar</span><div class="seg" id="edShow"><button data-show="icon">Icon</button><button data-show="nick">Nickname</button></div></div>
    </div>
    <div class="sched">
      <div class="row2">
        <label class="field"><span>How often</span>
          <select id="edFreq">
            <option value="none">No set schedule</option>
            <option value="daily">Every day</option>
            <option value="days">Certain days of the week</option>
            <option value="perweek">A number of times a week (any days)</option>
            <option value="cycle">Days on, days off</option>
          </select></label>
        <label class="field"><span>Details (optional)</span><input id="edSched" maxlength="40" placeholder="e.g. calf, side stomach"></label>
      </div>
      <div class="field" id="fDays"><span>Which days</span><div class="daypick" id="edDays"></div></div>
      <label class="field" id="fPerWeek"><span>Times a week</span><select id="edPerWeek"></select></label>
      <div class="cyc" id="fCycle">
        <label class="field"><span>Days on</span><select id="edOn"></select></label>
        <label class="field"><span>Days off</span><select id="edOff"></select></label>
        <label class="field"><span>First "on" day</span><input type="date" id="edStart"></label>
      </div>
      <div class="field" id="fRemind"><span>Reminder</span>
        <div class="remrow"><label class="chk"><input type="checkbox" id="edRemind"> Remind me at</label><input type="time" id="edTime" value="09:00"></div>
      </div>
    </div>
    <div class="field"><span>Icon</span><div class="picks" id="edShapes"></div></div>
    <div class="field"><span>Color</span><div class="picks" id="edColors"></div></div>
    <div class="edit-actions">
      <span class="preview" id="edPreview"></span>
      <span class="err" id="edErr"></span>
      <button class="btn danger" id="edRemove" hidden>Remove</button>
      <button class="btn" id="edCancel">Cancel</button>
      <button class="btn primary" id="edSave">Save</button>
    </div>
  </section>

  <section class="notebox" id="noteBox" hidden aria-labelledby="noteTitle">
    <h2 id="noteTitle">Note</h2>
    <textarea id="noteText" maxlength="1000" placeholder="How you felt, side effects, dose changes, anything to remember"></textarea>
    <div class="edit-actions">
      <span class="spacer">Command-Return also saves</span>
      <button class="btn danger" id="noteDelete" hidden>Delete note</button>
      <button class="btn" id="noteCancel">Cancel</button>
      <button class="btn primary" id="noteSave">Save note</button>
    </div>
  </section>

  <div class="cal" id="cal">
    <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="key"><span class="gw">${KEY_DUE}</span> Due <span class="gw missed">${KEY_MISS}</span> Missed</div>
  <div class="status" id="status"></div>
  <div class="backup">
    <button class="btn" id="remindBtn">Add reminders to Calendar</button>
    <button class="btn" id="backupBtn">Save a backup</button>
    <label class="btn">Restore a backup<input type="file" id="restoreFile" accept=".json,application/json"></label>
    <span id="backupMsg">Entries stay on this phone only.</span>
  </div>
</div>

<script>
const SHAPES = {
  tube: '<rect x="7" y="4" width="10" height="13" rx="2.5" fill="currentColor"/><rect x="9.5" y="17" width="5" height="3" rx="1" fill="currentColor"/><path d="M9 8h6" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>',
  syringe: '<g transform="rotate(45 12 12)"><rect x="9" y="3" width="6" height="12" rx="1.2" fill="currentColor"/><rect x="7.5" y="2" width="9" height="2" rx="1" fill="currentColor"/><rect x="11.25" y="15" width="1.5" height="7" fill="currentColor"/><path d="M10.5 7h2M10.5 10h2" stroke="#fff" stroke-opacity=".8" stroke-width="1.3" stroke-linecap="round"/></g>',
  capsule: '<ellipse cx="12" cy="12" rx="5.5" ry="8.5" transform="rotate(35 12 12)" fill="currentColor"/><ellipse cx="10" cy="9" rx="1.6" ry="2.6" transform="rotate(35 10 9)" fill="#fff" opacity=".5"/>',
  patch: '<rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor"/><rect x="8" y="8" width="8" height="8" rx="1.5" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="2 1.6"/>',
  pen: '<rect x="8" y="2" width="8" height="20" rx="4" fill="currentColor"/><circle cx="12" cy="7" r="2" fill="#fff" opacity=".8"/><rect x="9.5" y="13" width="5" height="5" rx="1" fill="#fff" opacity=".5"/>',
  pill: '<circle cx="12" cy="12" r="8.5" fill="currentColor"/><path d="M6.5 12h11" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>',
  twotone: '<g transform="rotate(-40 12 12)"><path d="M12 3.5a4.5 4.5 0 0 1 4.5 4.5V12h-9V8A4.5 4.5 0 0 1 12 3.5z" fill="currentColor"/><path d="M7.5 12h9v4a4.5 4.5 0 0 1-9 0z" fill="currentColor" opacity=".55"/></g>',
  drop: '<path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="currentColor"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" fill="none" stroke-linecap="round"/>',
  bottle: '<rect x="8" y="2.5" width="8" height="3.5" rx="1" fill="currentColor"/><rect x="6" y="7" width="12" height="14.5" rx="2.5" fill="currentColor"/><rect x="8.5" y="11" width="7" height="6" rx="1" fill="#fff" opacity=".7"/>',
  spray: '<rect x="7" y="9" width="10" height="12.5" rx="2.5" fill="currentColor"/><rect x="9.5" y="5" width="5" height="4" rx="1" fill="currentColor"/><path d="M15 6.5h3M17 4l2-1.5M17 9l2 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" fill="currentColor"/>',
  moon: '<path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.5 7 7 0 0 1-5-13.5z" fill="currentColor"/>',
  sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>',
};
const NOTE = { id: "__notes", name: "Notes", shape: "note", color: "#5b6b84" };
SHAPES.note = '<path d="M6 3h9l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4.5A1.5 1.5 0 0 1 6.5 3z" fill="currentColor"/><path d="M15 3v4h4" fill="#fff" opacity=".45"/><path d="M8.5 11h7M8.5 14h7M8.5 17h4.5" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round"/>';
const COLORS = ["#d4920f", "#8a4fd0", "#d24c7c", "#138a86", "#2f6fd6", "#3e9b3e", "#e0602f", "#c23b3b", "#5b6b84", "#0e9fc9"];
const DEFAULT_MEDS = [];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mark = (m, size) => (m.show === "nick" && m.nick) ? `<span class="nick" style="color:${m.color}">${esc(m.nick)}</span>` : icon(m, size);
const icon = (m, size) => `<svg viewBox="0 0 24 24" aria-hidden="true" style="color:${m.color}${size ? `;width:${size}px;height:${size}px` : ""}">${SHAPES[m.shape] || SHAPES.pill}</svg>`;
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const now = new Date();
const todayKey = keyOf(now);
let view = new Date(now.getFullYear(), now.getMonth(), 1);

// State: days[dateKey] = { meds: { medId: {...} }, notes }, meds = [...]
let days = {};
let meds = DEFAULT_MEDS.map(m => ({ ...m }));
let activeMed = null;
let editing = false;

// ---------- storage ----------
const APP = typeof window.__APP_SAVED === "object" && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.save;
const LS = "med-calendar-log";
function loadFrom(data) {
  if (!data || typeof data !== "object") return;
  if (data.version === 2) {
    days = data.days && typeof data.days === "object" ? data.days : {};
    if (Array.isArray(data.meds)) meds = data.meds;
  } else {
    days = data; // first version stored days only
  }
}
function save() {
  const payload = JSON.stringify({ version: 2, days, meds });
  try {
    if (APP) window.webkit.messageHandlers.save.postMessage(payload);
    else localStorage.setItem(LS, payload);
    setStatus("Saved");
  } catch (e) { setStatus("Could not save"); }
}
if (APP) loadFrom(window.__APP_SAVED);
else { try { loadFrom(JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {} }
activeMed = meds.length ? meds[0].id : null;
let statusTimer;
function setStatus(t) { const el = document.getElementById("status"); el.textContent = t; clearTimeout(statusTimer); statusTimer = setTimeout(() => el.textContent = "", 2000); }

// ---------- legend ----------
function renderLegend() {
  const lg = document.getElementById("legend");
  lg.classList.toggle("editing", editing);
  lg.innerHTML = meds.map(m => `<button class="med" data-med="${esc(m.id)}" aria-pressed="${!editing && activeMed === m.id}" style="--mc:${m.color}">${mark(m, 24)}<span class="lg"><b>${esc(m.name)}</b>${medLabel(m) ? `<i>${esc(medLabel(m))}</i>` : ""}</span></button>`).join("")
    + `<button class="med" data-med="__notes" aria-pressed="${!editing && activeMed === "__notes"}" style="--mc:${NOTE.color}">${icon(NOTE, 24)}<span class="lg"><b>Notes</b><i>Tap a day to write</i></span></button>`
    + `<button class="tool" id="addBtn">+ Add medication</button>`
    + `<button class="tool${editing ? " on" : ""}" id="editBtn">${editing ? "Done editing" : "Edit"}</button>`;
  const h = document.getElementById("hint");
  if (editing) h.innerHTML = "Tap a medication to change its name, schedule, icon or color, or to remove it.";
  else if (activeMed === "__notes") h.innerHTML = "Tap any day to write or change its note.";
  else if (activeMed) h.innerHTML = `Tap days to add or remove <b>${esc(medById(activeMed).name)}</b>.`;
  else h.innerHTML = meds.length ? "Pick a medication above, then tap the days you took it." : "Tap <b>+ Add medication</b> to set up your first one.";
}
const medById = id => meds.find(m => m.id === id);

// ---------- schedules ----------
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((Date.UTC(...b.split("-").map((v, i) => i === 1 ? v - 1 : +v)) - Date.UTC(...a.split("-").map((v, i) => i === 1 ? v - 1 : +v))) / 864e5);
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
function schedText(m) {
  const s = m.schedule; if (!s) return "";
  if (s.type === "daily") return "Every day";
  if (s.type === "days") {
    if (s.days.length === 7) return "Every day";
    if (s.days.length === 1) return "Every " + ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][s.days[0]];
    return s.days.slice().sort().map(d => DOW[d]).join(", ");
  }
  if (s.type === "perweek") return s.perWeek === 1 ? "Once a week" : s.perWeek === 2 ? "Twice a week" : s.perWeek + " times a week";
  if (s.type === "cycle") return `${s.on} days on, ${s.off} off`;
  return "";
}
const medLabel = m => [schedText(m), m.sched].filter(Boolean).join(" · ");
function isDueFixed(m, k) {
  const s = m.schedule; if (!s) return false;
  if (s.since && k < s.since) return false;
  if (s.type === "daily") return true;
  if (s.type === "days") return s.days.includes(parseKey(k).getDay());
  if (s.type === "cycle") { const d = dayDiff(s.start, k); return d >= 0 && d % (s.on + s.off) < s.on; }
  return false;
}
const isTaken = (m, k) => !!(days[k] && days[k].meds && days[k].meds[m.id]);
function weekCount(m, k) {
  const start = addDays(k, -parseKey(k).getDay());
  let c = 0; for (let i = 0; i < 7; i++) if (isTaken(m, addDays(start, i))) c++;
  return c;
}
function toggleDose(medId, k) {
  const e = days[k] || (days[k] = { meds: {}, notes: "" });
  if (!e.meds) e.meds = {};
  if (e.meds[medId]) delete e.meds[medId]; else e.meds[medId] = { site: "" };
  if (!Object.keys(e.meds).length && !e.notes) delete days[k];
  save(); renderGrid(); renderToday();
}
function renderToday() {
  const items = [];
  for (const m of meds) {
    const s = m.schedule; if (!s || s.type === "none") continue;
    const done = isTaken(m, todayKey);
    if (s.type === "perweek") {
      const c = weekCount(m, todayKey);
      if (c >= s.perWeek && !done) continue;
      items.push({ m, done, st: done ? `Done · ${c} of ${s.perWeek} this week` : `${c} of ${s.perWeek} this week` });
    } else if (isDueFixed(m, todayKey)) {
      items.push({ m, done, st: done ? "Done" : "Due" });
    }
  }
  const el = document.getElementById("todayCard");
  el.innerHTML = `<h2>Today</h2>` + (items.length
    ? items.map(it => `<button class="${it.done ? "done" : ""}" data-today="${esc(it.m.id)}" style="--mc:${it.m.color}" aria-label="${esc(it.m.name)}: ${it.st}. Tap to ${it.done ? "undo" : "mark as taken"}.">${mark(it.m, 20)}<span>${esc(it.m.name)}</span><span class="st">${it.st}</span></button>`).join("")
    : `<span class="none">${meds.some(m => m.schedule && m.schedule.type !== "none") ? "Nothing due today." : "Set a schedule for a medication (Edit, then tap it) to see what's due."}</span>`);
}
document.getElementById("todayCard").addEventListener("click", ev => {
  const b = ev.target.closest("[data-today]"); if (b) toggleDose(b.dataset.today, todayKey);
});
document.getElementById("legend").addEventListener("click", ev => {
  if (ev.target.closest("#addBtn")) { openEditor(null); return; }
  if (ev.target.closest("#editBtn")) { editing = !editing; closeEditor(); renderLegend(); return; }
  const b = ev.target.closest("[data-med]"); if (!b) return;
  if (editing) { if (b.dataset.med !== "__notes") openEditor(b.dataset.med); return; }
  closeNote();
  activeMed = activeMed === b.dataset.med ? null : b.dataset.med;
  renderLegend();
});

// ---------- editor ----------
let edShow = "icon";
let edId = null, edShape = "pill", edColor = COLORS[0], removeArmed = false;
let edDays = [];
(function initSchedFields() {
  const opt = (n, label) => `<option value="${n}">${label || n}</option>`;
  document.getElementById("edPerWeek").innerHTML = [1,2,3,4,5,6].map(n => opt(n)).join("");
  document.getElementById("edOn").innerHTML = Array.from({ length: 21 }, (_, i) => opt(i + 1)).join("");
  document.getElementById("edOff").innerHTML = Array.from({ length: 21 }, (_, i) => opt(i + 1)).join("");
})();
function renderSchedFields() {
  const t = document.getElementById("edFreq").value;
  document.getElementById("fDays").hidden = t !== "days";
  document.getElementById("fPerWeek").hidden = t !== "perweek";
  document.getElementById("fCycle").hidden = t !== "cycle";
  document.getElementById("fRemind").hidden = t === "none";
  document.getElementById("edDays").innerHTML = DOW.map((d, i) => `<button data-dow="${i}" aria-label="${d}" aria-pressed="${edDays.includes(i)}">${d[0]}</button>`).join("");
}
document.getElementById("edFreq").addEventListener("change", renderSchedFields);
document.getElementById("edDays").addEventListener("click", ev => {
  const b = ev.target.closest("[data-dow]"); if (!b) return;
  const i = +b.dataset.dow; edDays = edDays.includes(i) ? edDays.filter(x => x !== i) : [...edDays, i];
  renderSchedFields();
});
function openEditor(id) {
  edId = id; removeArmed = false;
  const m = id ? medById(id) : null;
  document.getElementById("edTitle").textContent = m ? `Edit ${m.name}` : "Add a medication";
  document.getElementById("edName").value = m ? m.name : "";
  document.getElementById("edSched").value = m ? (m.sched || "") : "";
  const sc = (m && m.schedule) || { type: "none", days: [], perWeek: 3, on: 5, off: 2, start: todayKey };
  document.getElementById("edFreq").value = sc.type || "none";
  edDays = (sc.days || []).slice();
  document.getElementById("edPerWeek").value = String(sc.perWeek || 3);
  document.getElementById("edOn").value = String(sc.on || 5);
  document.getElementById("edOff").value = String(sc.off || 2);
  document.getElementById("edStart").value = sc.start || todayKey;
  const rm0 = (m && m.remind) || { on: false, time: "09:00" };
  document.getElementById("edRemind").checked = !!rm0.on;
  document.getElementById("edTime").value = rm0.time || "09:00";
  renderSchedFields();
  document.getElementById("edNick").value = m ? (m.nick || "") : "";
  edShow = m && m.show === "nick" ? "nick" : "icon";
  const used = new Set(meds.map(x => x.shape)), usedC = new Set(meds.map(x => x.color));
  edShape = m ? m.shape : (Object.keys(SHAPES).find(s => s !== "note" && !used.has(s)) || "pill");
  edColor = m ? m.color : (COLORS.find(c => !usedC.has(c)) || COLORS[0]);
  const rm = document.getElementById("edRemove");
  rm.hidden = !m; rm.classList.remove("confirm"); rm.textContent = "Remove";
  document.getElementById("edErr").textContent = "";
  renderPicks();
  document.getElementById("editor").hidden = false;
  document.getElementById("edName").focus();
}
function closeEditor() { document.getElementById("editor").hidden = true; edId = null; }
function renderPicks() {
  document.getElementById("edShapes").innerHTML = Object.keys(SHAPES).filter(x => x !== "note").map(s => `<button data-shape="${s}" aria-label="${s} icon" aria-pressed="${s === edShape}">${icon({ shape: s, color: edColor })}</button>`).join("");
  document.getElementById("edColors").innerHTML = COLORS.map(c => `<button class="sw" data-color="${c}" aria-label="Color ${c}" aria-pressed="${c === edColor}" style="background:${c}"></button>`).join("");
  const name = document.getElementById("edName").value.trim() || "Preview";
  const nick = document.getElementById("edNick").value.trim();
  const nb = document.querySelector('#edShow [data-show="nick"]');
  nb.disabled = !nick;
  const showNow = nick && edShow === "nick" ? "nick" : "icon";
  document.querySelectorAll("#edShow [data-show]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.show === showNow)));
  document.getElementById("edPreview").innerHTML = `${mark({ shape: edShape, color: edColor, nick, show: showNow })}<span>${esc(name)}</span>`;
}
document.getElementById("edShapes").addEventListener("click", ev => { const b = ev.target.closest("[data-shape]"); if (b) { edShape = b.dataset.shape; renderPicks(); } });
document.getElementById("edColors").addEventListener("click", ev => { const b = ev.target.closest("[data-color]"); if (b) { edColor = b.dataset.color; renderPicks(); } });
document.getElementById("edName").addEventListener("input", renderPicks);
document.getElementById("edNick").addEventListener("input", renderPicks);
document.getElementById("edShow").addEventListener("click", ev => { const b = ev.target.closest("[data-show]"); if (b && !b.disabled) { edShow = b.dataset.show; renderPicks(); } });
document.getElementById("edCancel").onclick = closeEditor;
document.getElementById("edSave").onclick = () => {
  const name = document.getElementById("edName").value.trim();
  const sched = document.getElementById("edSched").value.trim();
  const nick = document.getElementById("edNick").value.trim();
  const show = nick && edShow === "nick" ? "nick" : "icon";
  const type = document.getElementById("edFreq").value;
  if (type === "days" && !edDays.length) { document.getElementById("edErr").textContent = "Pick at least one day."; return; }
  const prev = edId ? medById(edId).schedule : null;
  const schedule = type === "none" ? null : {
    type, days: edDays.slice().sort(),
    perWeek: +document.getElementById("edPerWeek").value,
    on: +document.getElementById("edOn").value, off: +document.getElementById("edOff").value,
    start: document.getElementById("edStart").value || todayKey,
    since: (prev && prev.since) || todayKey,
  };
  const remind = { on: document.getElementById("edRemind").checked && !!schedule, time: document.getElementById("edTime").value || "09:00" };
  if (!name) { document.getElementById("edErr").textContent = "Give the medication a name."; return; }
  if (edId) {
    Object.assign(medById(edId), { name, sched, nick, show, schedule, remind, shape: edShape, color: edColor });
  } else {
    const id = "m" + Date.now().toString(36);
    meds.push({ id, name, sched, nick, show, schedule, remind, shape: edShape, color: edColor });
    activeMed = id; editing = false;
  }
  save(); closeEditor(); renderLegend(); renderGrid(); renderToday();
};
document.getElementById("edRemove").onclick = ev => {
  const b = ev.currentTarget;
  if (!removeArmed) { removeArmed = true; b.classList.add("confirm"); b.textContent = "Tap again to remove"; return; }
  meds = meds.filter(m => m.id !== edId);
  for (const k of Object.keys(days)) { if (days[k].meds) delete days[k].meds[edId]; }
  if (activeMed === edId) activeMed = null;
  save(); closeEditor(); renderLegend(); renderGrid(); renderToday();
};

// ---------- calendar ----------
function renderGrid() {
  const y = view.getFullYear(), mo = view.getMonth();
  document.getElementById("monthTitle").textContent = view.toLocaleString("en-US", { month: "long", year: "numeric" });
  const first = new Date(y, mo, 1).getDay();
  const count = new Date(y, mo + 1, 0).getDate();
  let html = "";
  for (let i = 0; i < first; i++) html += `<div class="day blank"></div>`;
  for (let d = 1; d <= count; d++) {
    const k = `${y}-${pad(mo + 1)}-${pad(d)}`;
    const e = days[k];
    const taken = e && e.meds ? meds.filter(m => e.meds[m.id]) : [];
    const marks = meds.map(m => {
      if (e && e.meds && e.meds[m.id]) return mark(m);
      if (!isDueFixed(m, k)) return "";
      return `<span class="gw${k < todayKey ? " missed" : ""}" style="color:${m.color}" title="${esc(m.name)} ${k < todayKey ? "missed" : "due"}">${mark(m)}</span>`;
    }).join("");
    const dueNames = meds.filter(m => !(e && e.meds && e.meds[m.id]) && isDueFixed(m, k)).map(m => m.name);
    const label = `${view.toLocaleString("en-US", { month: "long" })} ${d}: ` + (taken.length ? taken.map(m => m.name).join(", ") : "nothing logged") + (dueNames.length ? (k < todayKey ? ". Missed: " : ". Due: ") + dueNames.join(", ") : "") + (e && e.notes ? ". Note: " + e.notes : "");
    html += `<button class="day${k === todayKey ? " today" : ""}" data-k="${k}" aria-label="${esc(label)}"><span class="n">${d}</span><div class="icons">${marks}</div>${e && e.notes ? `<div class="note">${icon(NOTE)}<span>${esc(e.notes)}</span></div>` : ""}</button>`;
  }
  document.getElementById("grid").innerHTML = html;
}
document.getElementById("grid").addEventListener("click", ev => {
  const b = ev.target.closest(".day[data-k]"); if (!b) return;
  if (editing) { document.getElementById("hint").innerHTML = "Tap <b>Done editing</b> first, then pick a medication."; return; }
  if (!activeMed) { document.getElementById("hint").innerHTML = "Pick a medication above first, then tap the day."; return; }
  const k = b.dataset.k;
  if (activeMed === "__notes") { openNote(k); return; }
  toggleDose(activeMed, k);
});
document.getElementById("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderGrid(); };
document.getElementById("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderGrid(); };
document.getElementById("todayBtn").onclick = () => { view = new Date(now.getFullYear(), now.getMonth(), 1); renderGrid(); };

// ---------- notes ----------
let noteKey = null;
function openNote(k) {
  noteKey = k;
  const [y, m, d] = k.split("-").map(Number);
  document.getElementById("noteTitle").textContent = "Note for " + new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const existing = (days[k] && days[k].notes) || "";
  const ta = document.getElementById("noteText");
  ta.value = existing;
  document.getElementById("noteDelete").hidden = !existing;
  document.getElementById("noteBox").hidden = false;
  ta.focus();
}
function closeNote() { document.getElementById("noteBox").hidden = true; noteKey = null; }
function saveNote() {
  if (!noteKey) return;
  const text = document.getElementById("noteText").value.trim();
  const e = days[noteKey] || (days[noteKey] = { meds: {}, notes: "" });
  e.notes = text;
  if (!text && (!e.meds || !Object.keys(e.meds).length)) delete days[noteKey];
  save(); closeNote(); renderGrid();
}
document.getElementById("noteSave").onclick = saveNote;
document.getElementById("noteCancel").onclick = closeNote;
document.getElementById("noteDelete").onclick = () => { document.getElementById("noteText").value = ""; saveNote(); };
document.getElementById("noteText").addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); saveNote(); } });

// ---------- backup ----------
const bmsg = t => document.getElementById("backupMsg").textContent = t;
document.getElementById("backupBtn").onclick = async () => {
  const text = JSON.stringify({ version: 2, days, meds }, null, 2);
  const name = "medication-log-" + todayKey + ".json";
  try {
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Medication log backup" });
      bmsg("Backup ready. Save it to Files or send it to yourself.");
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  bmsg("Backup saved to Downloads.");
};
document.getElementById("restoreFile").onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data !== "object") throw 0;
      meds = []; days = {}; loadFrom(data);
      activeMed = meds.length ? meds[0].id : null;
      save(); renderLegend(); renderGrid(); renderToday();
      bmsg("Backup restored.");
    } catch (e) { bmsg("That file isn't a medication calendar backup."); }
    ev.target.value = "";
  };
  r.readAsText(f);
};

// ---------- calendar reminders ----------
function icsDate(k, time) { return k.replace(/-/g, "") + "T" + time.replace(":", "") + "00"; }
function icsEsc(t) { return String(t).replace(/[\;,]/g, c => "\\" + c).replace(/\n/g, "\\n"); }
const BYDAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const SPREAD = { 1: [1], 2: [1, 4], 3: [1, 3, 5], 4: [0, 2, 4, 6], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6] };
function firstOnOrAfter(k, dowList) { for (let i = 0; i < 7; i++) { const d = addDays(k, i); if (dowList.includes(parseKey(d).getDay())) return d; } return k; }
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = [];
  for (const m of meds) {
    if (!m.remind || !m.remind.on || !m.schedule) continue;
    const s = m.schedule, t = m.remind.time || "09:00";
    const title = "Take " + m.name + (m.sched ? " (" + m.sched + ")" : "");
    const push = (uid, start, rule, desc) => ev.push([
      "BEGIN:VEVENT", "UID:" + uid + "@medcalendar", "DTSTAMP:" + stamp,
      "DTSTART:" + icsDate(start, t), "DURATION:PT15M", "RRULE:" + rule,
      "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc(desc),
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(title), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n"));
    const from = todayKey > (s.since || todayKey) ? todayKey : (s.since || todayKey);
    if (s.type === "daily") push(m.id + "-d", from, "FREQ=DAILY", "Every day");
    else if (s.type === "days") push(m.id + "-w", firstOnOrAfter(from, s.days), "FREQ=WEEKLY;BYDAY=" + s.days.map(d => BYDAY[d]).join(","), schedText(m));
    else if (s.type === "perweek") { const dl = SPREAD[s.perWeek] || [1]; push(m.id + "-p", firstOnOrAfter(from, dl), "FREQ=WEEKLY;BYDAY=" + dl.map(d => BYDAY[d]).join(","), schedText(m) + ", on any days you like"); }
    else if (s.type === "cycle") for (let i = 0; i < s.on; i++) push(m.id + "-c" + i, addDays(s.start, i), "FREQ=DAILY;INTERVAL=" + (s.on + s.off), schedText(m));
  }
  if (!ev.length) return null;
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Medication Calendar//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Medications", ...ev, "END:VCALENDAR", ""].join("\r\n");
}
document.getElementById("remindBtn").onclick = () => {
  const ics = buildICS();
  if (!ics) { bmsg("Turn on a reminder first: tap Edit, tap a medication, set how often, and check Remind me."); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "medication-reminders.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  bmsg("Open the file and choose Add All to put the reminders in your Calendar.");
};

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }

document.querySelector(".key").innerHTML = `<span class="gw">${icon({ shape: "pill", color: "currentColor" })}</span> Due <span class="gw missed">${icon({ shape: "pill", color: "currentColor" })}</span> Missed`;
renderLegend(); renderGrid(); renderToday();
</script>
