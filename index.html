<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Med Calendar">
<meta name="theme-color" content="#5a4fcf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Medication Calendar</title>
<style>
/* Layout: gradient page; compact top bar, Today card, one-row medication tray, calendar card. Day view and Medications open as sheets over the calendar. */
:root {
  --bg: #ece8fb;
  --bg-end: #f2a98a;
  --bg-grad: linear-gradient(160deg, #5a4fcf 0%, #8a63d2 34%, #c97fb8 68%, #f2a98a 100%);
  --on-bg: #ffffff;
  --on-bg-muted: rgba(255,255,255,.82);
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #667089;
  --line: #e2e5ee;
  --accent: #4b45c8;
  --chip: #f1f0fa;
  --danger: #c23b3b;
  --shadow: 0 4px 18px rgb(30 20 80 / .16);
  --font-display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141226; --bg-end: #4a2445; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%);
    --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75);
    --surface: #1d1f2c; --ink: #e8ebf3; --muted: #9aa2b8; --line: #2f3446; --accent: #9aa2ff; --chip: #262a3a; --danger: #ff7b7b;
    --shadow: 0 4px 18px rgb(0 0 0 / .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141226; --bg-end: #4a2445; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%);
  --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75);
  --surface: #1d1f2c; --ink: #e8ebf3; --muted: #9aa2b8; --line: #2f3446; --accent: #9aa2ff; --chip: #262a3a; --danger: #ff7b7b;
  --shadow: 0 4px 18px rgb(0 0 0 / .35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg-end); min-height: 100%; }
html, body { margin: 0; }
body { background: var(--bg-grad); background-color: var(--bg); min-height: 100vh; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right)); padding-block: calc(12px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.45rem, 5.5vw, 2rem); margin: 0; color: var(--on-bg); letter-spacing: -0.01em; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.2); color: var(--on-bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav button { height: 36px; min-width: 36px; border-radius: 999px; border: none; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); cursor: pointer; font-size: 17px; padding: 0 10px; }
.nav .todaybtn { font-size: 14px; font-weight: 600; padding: 0 14px; }
.seg { display: inline-flex; background: rgba(255,255,255,.2); border-radius: 999px; padding: 3px; }
.seg button { border: none; background: transparent; color: var(--on-bg); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); }

/* today card */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.today { padding: 12px 14px; display: grid; gap: 8px; }
.today h2 { margin: 0; font-family: var(--font-display); font-size: .95rem; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; }
.today h2 small { font-family: var(--font-body); color: var(--muted); font-weight: 500; font-size: 12.5px; }
.todaylist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.todaylist .none { grid-column: 1 / -1; }
.todaylist .none { color: var(--muted); font-size: 13.5px; }
.tchip { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 8px; border: 1.5px dashed var(--mc); background: var(--surface); border-radius: 12px; padding: 7px 10px; text-align: left; cursor: pointer; min-width: 0; }
.tchip > :first-child { grid-row: span 2; }
.tchip svg { width: 22px; height: 22px; }
.tchip .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tchip .st { color: var(--muted); font-size: 12px; }
.tchip.done { border-style: solid; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); }
.tchip.done .st { color: var(--mc); font-weight: 700; }

/* tray */
.tray { display: grid; gap: 6px; }
.trayrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 0 -2px; -webkit-overflow-scrolling: touch; }
.trayrow::-webkit-scrollbar { display: none; }
.stamp { flex: none; display: inline-flex; align-items: center; gap: 6px; border: none; background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer; max-width: 170px; }
.stamp > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stamp svg { width: 20px; height: 20px; flex: none; }
.stamp[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--mc), var(--shadow); background: color-mix(in srgb, var(--mc) 14%, var(--surface)); }
.trayhint { font-size: 12.5px; color: var(--on-bg-muted); min-height: 1.2em; }
.trayhint b { color: var(--on-bg); }

/* marks */
.nick { display: inline-block; font-weight: 800; font-size: 11px; line-height: 1; letter-spacing: .02em; padding: 3px 4px; border-radius: 5px; background: color-mix(in srgb, currentColor 13%, transparent); white-space: nowrap; }
.stamp .nick, .tchip .nick { font-size: 12px; padding: 4px 5px; }
.gw { display: inline-flex; align-items: center; border-radius: 5px; outline: 1.5px dashed currentColor; outline-offset: 1px; opacity: .5; }
.gw.missed { outline-color: var(--danger); opacity: .6; }

/* month grid */
.cal { padding: 8px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow div { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px 0 6px; font-weight: 600; }
.day { min-height: 88px; border: none; border-radius: 10px; background: transparent; text-align: left; padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:active { background: var(--chip); }
@media (hover: hover) { .day:hover { background: var(--chip); } }
.day.blank { visibility: hidden; cursor: default; }
.day .n { font-family: var(--font-display); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; line-height: 1; }
.day.today .n { background: var(--accent); color: var(--surface); }
.icons { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.icons svg { width: 19px; height: 19px; }
.notedot { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.day .note { display: flex; gap: 3px; font-size: 11px; line-height: 1.25; color: var(--muted); min-width: 0; }
.day .note svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.day .note span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
@media (max-width: 520px) {
  .day { min-height: 66px; padding: 3px; }
  .icons svg { width: 15px; height: 15px; }
  .icons .nick { font-size: 9.5px; padding: 2px 3px; }
  .icons { gap: 2px; }
  .day .note span { display: none; }
}

/* week list */
.week { display: grid; }
.wrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 74px; border: none; background: transparent; text-align: left; padding: 8px 6px; cursor: pointer; border-bottom: 1px solid var(--line); }
.wrow:last-child { border-bottom: none; }
.wrow:active { background: var(--chip); }
.wdate { display: grid; justify-items: center; gap: 2px; }
.wdate small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.wdate b { font-family: var(--font-display); font-size: 22px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.wrow.today .wdate b { background: var(--accent); color: var(--surface); }
.wbody { display: grid; gap: 5px; min-width: 0; }
.wbody .icons { gap: 6px; }
.wbody .icons svg { width: 28px; height: 28px; }
.wbody .icons .nick { font-size: 14px; padding: 5px 7px; }
.wbody .note { font-size: 13px; color: var(--muted); display: flex; gap: 5px; }
.wbody .note svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.wbody .empty { color: var(--muted); font-size: 13px; }

.key { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-bg-muted); }
.key .gw { color: var(--on-bg); margin-left: 4px; }
.key .gw svg { width: 15px; height: 15px; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgb(20 14 50 / .45); z-index: 20; opacity: 0; transition: opacity .18s; }
.backdrop.show { opacity: 1; }
.sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: min(100%, 560px); max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 30px rgb(20 14 50 / .3); padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
.sheet.show { transform: translate(-50%, 0); }
.sheet.zoom { top: 50%; bottom: auto; width: min(calc(100% - 24px), 480px); border-radius: 20px; max-height: 84vh; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s; padding-bottom: 18px; }
.sheet.zoom.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
@media (min-width: 700px) { .sheet:not(.zoom) { bottom: auto; top: 50%; border-radius: 20px; transform: translate(-50%, -45%); opacity: 0; transition: transform .2s, opacity .18s; } .sheet:not(.zoom).show { transform: translate(-50%, -50%); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet.zoom, .backdrop { transition: none; } }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.shead h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.shead .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.xbtn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--chip); cursor: pointer; display: grid; place-items: center; flex: none; }
.xbtn svg { width: 16px; height: 16px; }
.backbtn { border: none; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* day view rows */
.drows { display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; }
.drow .mk { display: grid; place-items: center; }
.drow .mk svg { width: 32px; height: 32px; }
.drow .mk .nick { font-size: 14px; padding: 5px 6px; }
.drow b { display: block; font-weight: 600; }
.drow small { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; border: 1.5px dashed var(--line); color: var(--muted); }
.pill.due { border-color: var(--mc); color: var(--ink); }
.pill.missed { border-color: var(--danger); color: var(--danger); }
.drow.taken { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 10%, var(--surface)); }
.drow.taken .pill { border: none; background: var(--mc); color: #fff; }
.dnote { display: grid; gap: 6px; margin-top: 14px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
textarea, .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
.sfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.confirm { background: var(--danger); color: var(--surface); }
.empty-note { color: var(--muted); font-size: 14px; }

/* manage list */
.mlist { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; width: 100%; }
.mrow .mk svg { width: 28px; height: 28px; }
.mrow b { display: block; font-weight: 600; }
.mrow small { color: var(--muted); font-size: 12.5px; }
.mrow .chev { color: var(--muted); font-size: 20px; }
.mrow.add { border-style: dashed; color: var(--accent); font-weight: 600; grid-template-columns: 1fr; text-align: center; }
.msect { margin-top: 18px; display: grid; gap: 8px; }
.msect .btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.msect label.btn input { display: none; }
.mmsg { font-size: 13px; color: var(--muted); min-height: 1.2em; }

/* editor */
.ed { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.sched { display: grid; gap: 12px; padding: 12px; border-radius: 14px; background: var(--chip); }
.daypick { display: flex; flex-wrap: wrap; gap: 6px; }
.daypick button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.cyc { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.remrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.remrow input[type=time] { width: auto; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; justify-self: start; }
.segc button { border: none; background: var(--surface); padding: 9px 16px; font-size: 14px; cursor: pointer; }
.segc button + button { border-left: 1px solid var(--line); }
.segc button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.segc button:disabled { opacity: .45; cursor: not-allowed; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.picks button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.picks button svg { width: 26px; height: 26px; }
.picks button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.picks .sw { width: 34px; height: 34px; border-radius: 50%; }
.preview { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; margin-right: auto; }
.preview svg { width: 30px; height: 30px; }
.preview .nick { font-size: 14px; padding: 5px 7px; }
.err { color: var(--danger); font-size: 13px; width: 100%; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgb(20 14 50 / .85); color: #fff; font-size: 13px; padding: 7px 14px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">Medication Calendar</h1>
    <button class="iconbtn" id="manageBtn" aria-label="Medications and settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
  <div class="controls">
    <div class="nav">
      <button id="prev" aria-label="Previous">‹</button>
      <button id="todayBtn" class="todaybtn">Today</button>
      <button id="next" aria-label="Next">›</button>
    </div>
    <div class="seg" role="group" aria-label="Calendar view">
      <button data-view="month">Month</button>
      <button data-view="week">Week</button>
    </div>
  </div>

  <section class="card today" aria-labelledby="todayTitle">
    <h2 id="todayTitle">Today <small id="todayDate"></small></h2>
    <div class="todaylist" id="todayList"></div>
  </section>

  <div class="tray">
    <div class="trayrow" id="tray" role="toolbar" aria-label="Quick mark"></div>
    <div class="trayhint" id="hint"></div>
  </div>

  <section class="card cal" id="cal" aria-label="Calendar"></section>
  <div class="key" id="key"></div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
const SHAPES = {
  tube: '<rect x="7" y="4" width="10" height="13" rx="2.5" fill="currentColor"/><rect x="9.5" y="17" width="5" height="3" rx="1" fill="currentColor"/><path d="M9 8h6" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>',
  syringe: '<g transform="rotate(45 12 12)"><rect x="9" y="3" width="6" height="12" rx="1.2" fill="currentColor"/><rect x="7.5" y="2" width="9" height="2" rx="1" fill="currentColor"/><rect x="11.25" y="15" width="1.5" height="7" fill="currentColor"/><path d="M10.5 7h2M10.5 10h2" stroke="#fff" stroke-opacity=".8" stroke-width="1.3" stroke-linecap="round"/></g>',
  capsule: '<ellipse cx="12" cy="12" rx="5.5" ry="8.5" transform="rotate(35 12 12)" fill="currentColor"/><ellipse cx="10" cy="9" rx="1.6" ry="2.6" transform="rotate(35 10 9)" fill="#fff" opacity=".5"/>',
  patch: '<rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor"/><rect x="8" y="8" width="8" height="8" rx="1.5" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="2 1.6"/>',
  pen: '<rect x="8" y="2" width="8" height="20" rx="4" fill="currentColor"/><circle cx="12" cy="7" r="2" fill="#fff" opacity=".8"/><rect x="9.5" y="13" width="5" height="5" rx="1" fill="#fff" opacity=".5"/>',
  pill: '<circle cx="12" cy="12" r="8.5" fill="currentColor"/><path d="M6.5 12h11" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>',
  twotone: '<g transform="rotate(-40 12 12)"><path d="M12 3.5a4.5 4.5 0 0 1 4.5 4.5V12h-9V8A4.5 4.5 0 0 1 12 3.5z" fill="currentColor"/><path d="M7.5 12h9v4a4.5 4.5 0 0 1-9 0z" fill="currentColor" opacity=".55"/></g>',
  drop: '<path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="currentColor"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" fill="none" stroke-linecap="round"/>',
  bottle: '<rect x="8" y="2.5" width="8" height="3.5" rx="1" fill="currentColor"/><rect x="6" y="7" width="12" height="14.5" rx="2.5" fill="currentColor"/><rect x="8.5" y="11" width="7" height="6" rx="1" fill="#fff" opacity=".7"/>',
  spray: '<rect x="7" y="9" width="10" height="12.5" rx="2.5" fill="currentColor"/><rect x="9.5" y="5" width="5" height="4" rx="1" fill="currentColor"/><path d="M15 6.5h3M17 4l2-1.5M17 9l2 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" fill="currentColor"/>',
  moon: '<path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.5 7 7 0 0 1-5-13.5z" fill="currentColor"/>',
  sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>',
};
SHAPES.note = '<path d="M6 3h9l4 4v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4.5A1.5 1.5 0 0 1 6.5 3z" fill="currentColor"/><path d="M15 3v4h4" fill="#fff" opacity=".45"/><path d="M8.5 11h7M8.5 14h7M8.5 17h4.5" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round"/>';
const NOTE = { shape: "note", color: "#7a83a0" };
const XICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const COLORS = ["#d4920f", "#8a4fd0", "#d24c7c", "#138a86", "#2f6fd6", "#3e9b3e", "#e0602f", "#c23b3b", "#5b6b84", "#0e9fc9"];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icon = (m, size) => `<svg viewBox="0 0 24 24" aria-hidden="true" style="color:${m.color}${size ? `;width:${size}px;height:${size}px` : ""}">${SHAPES[m.shape] || SHAPES.pill}</svg>`;
const mark = (m, size) => (m.show === "nick" && m.nick) ? `<span class="nick" style="color:${m.color}">${esc(m.nick)}</span>` : icon(m, size);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const utc = k => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const fmtLong = k => parseKey(k).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
const fmtShort = k => parseKey(k).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const todayKey = keyOf(new Date());

// ---------- state & storage ----------
let days = {}, meds = [];
let activeMed = null;
const LS = "med-calendar-log", PREF = "med-calendar-prefs";
let prefs = { view: "month" };
try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(PREF) || "{}")); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {} };
function loadFrom(data) {
  if (!data || typeof data !== "object") return;
  if (data.version === 2) {
    days = data.days && typeof data.days === "object" ? data.days : {};
    if (Array.isArray(data.meds)) meds = data.meds;
  } else days = data;
}
try { loadFrom(JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
function save() {
  try { localStorage.setItem(LS, JSON.stringify({ version: 2, days, meds })); toast("Saved"); }
  catch (e) { toast("Could not save"); }
}
let toastT;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1200); }

// view cursor: month view uses first of month; week view uses Sunday of week
let cursor = todayKey;

// ---------- schedules ----------
const medById = id => meds.find(m => m.id === id);
function schedText(m) {
  const s = m.schedule; if (!s) return "";
  if (s.type === "daily") return "Every day";
  if (s.type === "days") {
    if (s.days.length === 7) return "Every day";
    if (s.days.length === 1) return "Every " + DOWL[s.days[0]];
    return s.days.slice().sort().map(d => DOW[d]).join(", ");
  }
  if (s.type === "perweek") return s.perWeek === 1 ? "Once a week" : s.perWeek === 2 ? "Twice a week" : s.perWeek + " times a week";
  if (s.type === "cycle") return `${s.on} days on, ${s.off} off`;
  return "";
}
const medLabel = m => [schedText(m), m.sched].filter(Boolean).join(" · ");
function isDueFixed(m, k) {
  const s = m.schedule; if (!s) return false;
  if (s.since && k < s.since) return false;
  if (s.type === "daily") return true;
  if (s.type === "days") return s.days.includes(parseKey(k).getDay());
  if (s.type === "cycle") { const d = dayDiff(s.start, k); return d >= 0 && d % (s.on + s.off) < s.on; }
  return false;
}
const isTaken = (m, k) => !!(days[k] && days[k].meds && days[k].meds[m.id]);
function weekCount(m, k) {
  const start = addDays(k, -parseKey(k).getDay());
  let c = 0; for (let i = 0; i < 7; i++) if (isTaken(m, addDays(start, i))) c++;
  return c;
}
function statusFor(m, k) {
  if (isTaken(m, k)) return "taken";
  if (isDueFixed(m, k)) return k < todayKey ? "missed" : "due";
  return "";
}
function toggleDose(medId, k) {
  const e = days[k] || (days[k] = { meds: {}, notes: "" });
  if (!e.meds) e.meds = {};
  if (e.meds[medId]) delete e.meds[medId]; else e.meds[medId] = { site: "" };
  if (!Object.keys(e.meds).length && !e.notes) delete days[k];
  save(); renderMain();
}

// ---------- main render ----------
function renderMain() { renderTop(); renderToday(); renderTray(); renderCal(); }
function weekStart(k) { return addDays(k, -parseKey(k).getDay()); }
function renderTop() {
  const d = parseKey(cursor);
  let t;
  if (prefs.view === "week") {
    const s = weekStart(cursor), e = addDays(s, 6);
    const sd = parseKey(s), ed = parseKey(e);
    t = sd.getMonth() === ed.getMonth()
      ? `${sd.toLocaleString("en-US", { month: "short" })} ${sd.getDate()} – ${ed.getDate()}`
      : `${fmtShort(s)} – ${fmtShort(e)}`;
  } else t = d.toLocaleString("en-US", { month: "long", year: "numeric" });
  document.getElementById("title").textContent = t;
  document.querySelectorAll(".seg [data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === prefs.view)));
}
function renderToday() {
  document.getElementById("todayDate").textContent = fmtLong(todayKey);
  const items = [];
  for (const m of meds) {
    const s = m.schedule; if (!s) continue;
    const done = isTaken(m, todayKey);
    if (s.type === "perweek") {
      const c = weekCount(m, todayKey);
      if (c >= s.perWeek && !done) continue;
      items.push({ m, done, st: `${c} of ${s.perWeek} this week` });
    } else if (isDueFixed(m, todayKey)) items.push({ m, done, st: done ? "Done" : "Due" });
  }
  document.getElementById("todayList").innerHTML = items.length
    ? items.map(it => `<button class="tchip${it.done ? " done" : ""}" data-today="${esc(it.m.id)}" style="--mc:${it.m.color}" aria-label="${esc(it.m.name)}: ${it.st}. Tap to ${it.done ? "undo" : "mark as taken"}.">${mark(it.m, 22)}<span class="nm">${esc(it.m.name)}</span><span class="st">${it.done && it.st !== "Done" ? "✓ " : ""}${it.st}</span></button>`).join("")
    : `<span class="none">${!meds.length ? "Tap the settings button at the top right to add your medications." : meds.some(m => m.schedule) ? "Nothing due today." : "Give a medication a schedule (settings button, then tap it) to see what's due."}</span>`;
}
function renderTray() {
  const tray = document.getElementById("tray");
  tray.innerHTML = meds.map(m => `<button class="stamp" data-med="${esc(m.id)}" aria-pressed="${activeMed === m.id}" style="--mc:${m.color}">${mark(m, 22)}<span>${esc(m.name)}</span></button>`).join("")
    || `<button class="stamp" id="trayAdd" style="--mc:var(--accent)">+ Add medication</button>`;
  const h = document.getElementById("hint");
  h.innerHTML = activeMed && medById(activeMed)
    ? `Tap days to mark <b>${esc(medById(activeMed).name)}</b>. Tap it again to stop.`
    : meds.length ? "Tap a day to open it · pick one above to mark days fast" : "";
}
function dayMarks(k) {
  return meds.map(m => {
    const st = statusFor(m, k);
    if (st === "taken") return mark(m);
    if (!st) return "";
    return `<span class="gw${st === "missed" ? " missed" : ""}" style="color:${m.color}">${mark(m)}</span>`;
  }).join("");
}
function dayLabel(k) {
  const taken = meds.filter(m => isTaken(m, k)).map(m => m.name);
  const due = meds.filter(m => !isTaken(m, k) && isDueFixed(m, k)).map(m => m.name);
  const e = days[k];
  return `${fmtLong(k)}: ${taken.length ? "taken " + taken.join(", ") : "nothing logged"}${due.length ? (k < todayKey ? ". Missed: " : ". Due: ") + due.join(", ") : ""}${e && e.notes ? ". Note: " + e.notes : ""}`;
}
function renderCal() {
  const cal = document.getElementById("cal");
  if (prefs.view === "week") {
    const s = weekStart(cursor);
    let html = `<div class="week">`;
    for (let i = 0; i < 7; i++) {
      const k = addDays(s, i), e = days[k], marks = dayMarks(k);
      html += `<button class="wrow${k === todayKey ? " today" : ""}" data-k="${k}" aria-label="${esc(dayLabel(k))}">
        <span class="wdate"><small>${DOW[i]}</small><b>${parseKey(k).getDate()}</b></span>
        <span class="wbody">${marks ? `<span class="icons">${marks}</span>` : `<span class="empty">Nothing logged</span>`}${e && e.notes ? `<span class="note">${icon(NOTE)}<span>${esc(e.notes)}</span></span>` : ""}</span></button>`;
    }
    cal.innerHTML = html + `</div>`;
  } else {
    const d = parseKey(cursor), y = d.getFullYear(), mo = d.getMonth();
    const first = new Date(y, mo, 1).getDay(), count = new Date(y, mo + 1, 0).getDate();
    let html = `<div class="dow">${DOW.map(x => `<div>${x}</div>`).join("")}</div><div class="grid">`;
    for (let i = 0; i < first; i++) html += `<div class="day blank"></div>`;
    for (let n = 1; n <= count; n++) {
      const k = `${y}-${pad(mo + 1)}-${pad(n)}`, e = days[k];
      html += `<button class="day${k === todayKey ? " today" : ""}" data-k="${k}" aria-label="${esc(dayLabel(k))}"><span class="n">${n}</span><span class="icons">${dayMarks(k)}</span>${e && e.notes ? `<span class="note">${icon(NOTE)}<span>${esc(e.notes)}</span></span>` : ""}</button>`;
    }
    cal.innerHTML = html + `</div>`;
  }
  document.getElementById("key").innerHTML = meds.some(m => m.schedule && m.schedule.type !== "perweek")
    ? `<span class="gw">${icon({ shape: "pill", color: "currentColor" })}</span> Due <span class="gw missed">${icon({ shape: "pill", color: "currentColor" })}</span> Missed` : "";
}

// ---------- main events ----------
document.getElementById("todayList").addEventListener("click", ev => { const b = ev.target.closest("[data-today]"); if (b) toggleDose(b.dataset.today, todayKey); });
document.getElementById("tray").addEventListener("click", ev => {
  if (ev.target.closest("#trayAdd")) { openSheet("edit", null); return; }
  const b = ev.target.closest("[data-med]"); if (!b) return;
  activeMed = activeMed === b.dataset.med ? null : b.dataset.med;
  renderTray();
});
document.getElementById("cal").addEventListener("click", ev => {
  const b = ev.target.closest("[data-k]"); if (!b) return;
  if (activeMed && medById(activeMed)) { toggleDose(activeMed, b.dataset.k); return; }
  openSheet("day", b.dataset.k, b);
});
document.querySelectorAll(".seg [data-view]").forEach(b => b.onclick = () => { prefs.view = b.dataset.view; savePrefs(); renderMain(); });
function step(dir) {
  if (prefs.view === "week") cursor = addDays(cursor, 7 * dir);
  else { const d = parseKey(cursor); cursor = keyOf(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
  renderMain();
}
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("todayBtn").onclick = () => { cursor = todayKey; renderMain(); };
document.getElementById("manageBtn").onclick = () => openSheet("manage");

// ---------- sheets ----------
const sheet = document.getElementById("sheet"), backdrop = document.getElementById("backdrop");
let sheetKind = null, sheetArg = null;
function openSheet(kind, arg, originEl) {
  sheetKind = kind; sheetArg = arg;
  sheet.className = "sheet" + (kind === "day" ? " zoom" : "");
  if (kind === "day" && originEl) {
    const r = originEl.getBoundingClientRect();
    const ox = r.left + r.width / 2 - window.innerWidth / 2, oy = r.top + r.height / 2 - window.innerHeight / 2;
    sheet.style.transformOrigin = `calc(50% + ${ox}px) calc(50% + ${oy}px)`;
  } else sheet.style.transformOrigin = "";
  renderSheet();
  backdrop.hidden = false; sheet.hidden = false;
  document.body.classList.add("locked");
  requestAnimationFrame(() => { backdrop.classList.add("show"); sheet.classList.add("show"); });
}
function closeSheet() {
  if (sheetKind === "day") flushNote();
  backdrop.classList.remove("show"); sheet.classList.remove("show");
  document.body.classList.remove("locked");
  setTimeout(() => { if (!sheet.classList.contains("show")) { sheet.hidden = true; backdrop.hidden = true; } }, 230);
  sheetKind = null;
  renderMain();
}
backdrop.onclick = closeSheet;
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && sheetKind) closeSheet(); });
function renderSheet() {
  if (sheetKind === "day") renderDaySheet(sheetArg);
  else if (sheetKind === "manage") renderManage();
  else if (sheetKind === "edit") renderEditor(sheetArg);
}

// ----- day sheet -----
let noteTimer = null, noteKey = null;
function flushNote() {
  if (!noteKey) return;
  clearTimeout(noteTimer);
  const ta = document.getElementById("dNote"); if (!ta) return;
  const text = ta.value.trim(), k = noteKey;
  const e = days[k] || { meds: {}, notes: "" };
  if ((e.notes || "") === text) return;
  e.notes = text; days[k] = e;
  if (!text && (!e.meds || !Object.keys(e.meds).length)) delete days[k];
  save();
}
function renderDaySheet(k) {
  noteKey = k;
  const e = days[k] || {};
  const rows = meds.map(m => {
    const st = statusFor(m, k);
    const pillText = st === "taken" ? "Taken" : st === "due" ? "Due" : st === "missed" ? "Missed" : "Not taken";
    return `<button class="drow${st === "taken" ? " taken" : ""}" data-dmed="${esc(m.id)}" style="--mc:${m.color}" aria-pressed="${st === "taken"}">
      <span class="mk">${mark(m, 32)}</span><span><b>${esc(m.name)}</b>${medLabel(m) ? `<small>${esc(medLabel(m))}</small>` : ""}</span><span class="pill ${st}">${pillText}</span></button>`;
  }).join("");

  sheet.setAttribute("aria-label", fmtLong(k));
  sheet.innerHTML = `<div class="shead"><div><h2>${DOWL[wk.getDay()]}, ${wk.toLocaleDateString("en-US", { month: "long", day: "numeric" })}</h2><div class="sub">${k === todayKey ? "Today" : k < todayKey ? dayDiff(k, todayKey) + " days ago" : "In " + dayDiff(todayKey, k) + " days"} · tap a medication to mark it</div></div><button class="xbtn" data-close aria-label="Close">${XICON}</button></div>
    <div class="drows">${rows || `<p class="empty-note">No medications yet. Add them from the settings button.</p>`}</div>
    <div class="dnote"><span class="lbl">Note</span><textarea id="dNote" maxlength="1000" placeholder="How you felt, side effects, dose changes">${esc(e.notes || "")}</textarea></div>
    <div class="sfoot"><button class="btn primary" data-close>Done</button></div>`;
}

// ----- manage sheet -----
let mmsg = "";
function renderManage() {
  sheet.setAttribute("aria-label", "Medications");
  sheet.innerHTML = `<div class="shead"><h2>Medications</h2><button class="xbtn" data-close aria-label="Close">${XICON}</button></div>
    <div class="mlist">${meds.map(m => `<button class="mrow" data-edit="${esc(m.id)}"><span class="mk">${mark(m, 28)}</span><span><b>${esc(m.name)}</b><small>${esc(medLabel(m) || "No schedule")}${m.remind && m.remind.on ? " · reminder " + fmtTime(m.remind.time) : ""}</small></span><span class="chev">›</span></button>`).join("")}
      <button class="mrow add" data-edit="">+ Add medication</button></div>
    <div class="msect">
      <span class="lbl">Reminders</span>
      <button class="btn" id="remindBtn">Add reminders to Calendar <span>›</span></button>
      <span class="lbl" style="margin-top:8px">Backup</span>
      <button class="btn" id="backupBtn">Save a backup <span>›</span></button>
      <label class="btn">Restore a backup <span>›</span><input type="file" id="restoreFile" accept=".json,application/json"></label>
      <span class="mmsg" id="mmsg">${esc(mmsg || "Your entries are stored only on this phone.")}</span>
    </div>`;
}
const fmtTime = t => { const [h, m] = (t || "09:00").split(":").map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const setMsg = t => { mmsg = t; const el = document.getElementById("mmsg"); if (el) el.textContent = t; };

// ----- editor sheet -----
let ed = null;
function renderEditor(id) {

  const rm = (m && m.remind) || { on: false, time: "09:00" };

    id, name: m ? m.name : "", nick: m ? (m.nick || "") : "", show: m && m.show === "nick" ? "nick" : "icon", sched: m ? (m.sched || "") : "",

  <div class="ed">
    <div class="row2">
      <label class="field"><span class="lbl">Name</span><input id="edName" maxlength="40" placeholder="e.g. Progesterone" value="${esc(ed.name)}"></label>
      <label class="field"><span class="lbl">Nickname (up to 6 letters)</span><input id="edNick" maxlength="6" placeholder="e.g. TC, Zep" value="${esc(ed.nick)}"></label>
    </div>
    <div class="field"><span class="lbl">Show on calendar</span><div class="segc" id="edShow"><button data-show="icon">Icon</button><button data-show="nick">Nickname</button></div></div>
    <div class="sched">
      <div class="row2">
        <label class="field"><span class="lbl">How often</span>
          <select id="edFreq">

            <option value="perweek">A number of times a week (any days)</option><option value="cycle">Days on, days off</option>
          </select></label>
        <label class="field"><span class="lbl">Details (optional)</span><input id="edSched" maxlength="40" placeholder="e.g. calf, side stomach" value="${esc(ed.sched)}"></label>
      </div>
      <div class="field" id="fDays"><span class="lbl">Which days</span><div class="daypick" id="edDays"></div></div>
      <label class="field" id="fPerWeek"><span class="lbl">Times a week</span><select id="edPerWeek">${opts([1,2,3,4,5,6], ed.perWeek)}</select></label>
      <div class="cyc" id="fCycle">
        <label class="field"><span class="lbl">Days on</span><select id="edOn">${opts(Array.from({ length: 21 }, (_, i) => i + 1), ed.on)}</select></label>
        <label class="field"><span class="lbl">Days off</span><select id="edOff">${opts(Array.from({ length: 21 }, (_, i) => i + 1), ed.off)}</select></label>
        <label class="field"><span class="lbl">First "on" day</span><input type="date" id="edStart" value="${ed.start}"></label>
      </div>
      <div class="field" id="fRemind"><span class="lbl">Reminder</span>
        <div class="remrow"><label class="chk"><input type="checkbox" id="edRemind"${ed.remind ? " checked" : ""}> Remind me at</label><input type="time" id="edTime" value="${ed.time}"></div>
      </div>
    </div>
    <div class="field"><span class="lbl">Icon</span><div class="picks" id="edShapes"></div></div>
    <div class="field"><span class="lbl">Color</span><div class="picks" id="edColors"></div></div>
    <div class="sfoot" style="align-items:center">
      <span class="preview" id="edPreview"></span>
      ${m ? `<button class="btn danger" id="edRemove">Remove</button>` : ""}
      <button class="btn primary" id="edSave">Save</button>
      <span class="err" id="edErr"></span>
    </div>
  </div>`;
  document.getElementById("edFreq").value = ed.type;
  edRefresh();
}
function edRefresh() {
  const nick = document.getElementById("edNick").value.trim();
  ed.type = document.getElementById("edFreq").value;
  document.getElementById("fDays").hidden = ed.type !== "days";
  document.getElementById("fPerWeek").hidden = ed.type !== "perweek";
  document.getElementById("fCycle").hidden = ed.type !== "cycle";
  document.getElementById("fRemind").hidden = ed.type === "none";
  document.getElementById("edDays").innerHTML = DOW.map((d, i) => `<button data-dow="${i}" aria-label="${DOWL[i]}" aria-pressed="${ed.days.includes(i)}">${d[0]}</button>`).join("");
  const showNow = nick && ed.show === "nick" ? "nick" : "icon";
  document.querySelector('#edShow [data-show="nick"]').disabled = !nick;
  document.querySelectorAll("#edShow [data-show]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.show === showNow)));
  document.getElementById("edShapes").innerHTML = Object.keys(SHAPES).filter(s => s !== "note").map(s => `<button data-shape="${s}" aria-label="${s} icon" aria-pressed="${s === ed.shape}">${icon({ shape: s, color: ed.color })}</button>`).join("");
  document.getElementById("edColors").innerHTML = COLORS.map(c => `<button class="sw" data-color="${c}" aria-label="Color ${c}" aria-pressed="${c === ed.color}" style="background:${c}"></button>`).join("");
  const name = document.getElementById("edName").value.trim() || "Preview";
  document.getElementById("edPreview").innerHTML = `${mark({ shape: ed.shape, color: ed.color, nick, show: showNow }, 30)}<span>${esc(name)}</span>`;
}
function edSave() {
  const $ = id => document.getElementById(id);
  const name = $("edName").value.trim();
  if (!name) { $("edErr").textContent = "Give the medication a name."; return; }
  if (ed.type === "days" && !ed.days.length) { $("edErr").textContent = "Pick at least one day."; return; }
  const nick = $("edNick").value.trim();
  const show = nick && ed.show === "nick" ? "nick" : "icon";
  const prev = ed.id ? medById(ed.id).schedule : null;
  const schedule = ed.type === "none" ? null : {
    type: ed.type, days: ed.days.slice().sort(), perWeek: +$("edPerWeek").value,
    on: +$("edOn").value, off: +$("edOff").value, start: $("edStart").value || todayKey,
    since: (prev && prev.since) || todayKey,
  };
  const remind = { on: $("edRemind").checked && !!schedule, time: $("edTime").value || "09:00" };
  const fields = { name, nick, show, sched: $("edSched").value.trim(), schedule, remind, shape: ed.shape, color: ed.color };
  if (ed.id) Object.assign(medById(ed.id), fields);
  else meds.push(Object.assign({ id: "m" + Date.now().toString(36) }, fields));
  save(); sheetKind = "manage"; renderSheet();
}

// ----- sheet events -----
sheet.addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest("[data-close]")) { closeSheet(); return; }
  if (sheetKind === "day") {
    const r = t.closest("[data-dmed]");
    if (r) { flushNote(); toggleDose(r.dataset.dmed, sheetArg); renderDaySheet(sheetArg); }
    return;
  }
  if (sheetKind === "manage") {
    const e = t.closest("[data-edit]");
    if (e) { sheetKind = "edit"; sheetArg = e.dataset.edit || null; renderSheet(); sheet.scrollTop = 0; return; }
    if (t.closest("#remindBtn")) { exportReminders(); return; }
    if (t.closest("#backupBtn")) { saveBackup(); return; }
    return;
  }
  if (sheetKind === "edit") {
    if (t.closest("[data-back]")) { sheetKind = "manage"; renderSheet(); return; }
    const d = t.closest("[data-dow]"); if (d) { const i = +d.dataset.dow; ed.days = ed.days.includes(i) ? ed.days.filter(x => x !== i) : [...ed.days, i]; edRefresh(); return; }
    const sh = t.closest("[data-shape]"); if (sh) { ed.shape = sh.dataset.shape; edRefresh(); return; }
    const co = t.closest("[data-color]"); if (co) { ed.color = co.dataset.color; edRefresh(); return; }
    const sw = t.closest("[data-show]"); if (sw && !sw.disabled) { ed.show = sw.dataset.show; edRefresh(); return; }
    if (t.closest("#edSave")) { edSave(); return; }
    const rmb = t.closest("#edRemove");
    if (rmb) {
      if (!ed.armed) { ed.armed = true; rmb.classList.add("confirm"); rmb.textContent = "Tap again to remove"; return; }
      meds = meds.filter(m => m.id !== ed.id);
      for (const k of Object.keys(days)) if (days[k].meds) delete days[k].meds[ed.id];
      if (activeMed === ed.id) activeMed = null;
      save(); sheetKind = "manage"; renderSheet();
    }
  }
});
sheet.addEventListener("input", ev => {
  if (sheetKind === "day" && ev.target.id === "dNote") { clearTimeout(noteTimer); noteTimer = setTimeout(flushNote, 700); }
  if (sheetKind === "edit" && (ev.target.id === "edName" || ev.target.id === "edNick")) edRefresh();
});
sheet.addEventListener("change", ev => {
  if (sheetKind === "edit" && ev.target.id === "edFreq") edRefresh();
  if (sheetKind === "manage" && ev.target.id === "restoreFile") restoreBackup(ev.target);
});

// ---------- backup ----------
async function saveBackup() {
  const text = JSON.stringify({ version: 2, days, meds }, null, 2);
  const name = "medication-log-" + todayKey + ".json";
  try {
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Medication log backup" }); setMsg("Backup ready. Save it to Files or send it to yourself."); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  downloadText(text, name, "application/json");
  setMsg("Backup saved to Downloads.");
}
function restoreBackup(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result); if (!data || typeof data !== "object") throw 0;
      meds = []; days = {}; loadFrom(data); activeMed = null;
      save(); renderSheet(); setMsg("Backup restored.");
    } catch (e) { setMsg("That file isn't a medication calendar backup."); }
    input.value = "";
  };
  r.readAsText(f);
}
function downloadText(text, name, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ---------- calendar reminders ----------
function icsDate(k, time) { return k.replace(/-/g, "") + "T" + time.replace(":", "") + "00"; }
function icsEsc(t) { return String(t).replace(/[\\;,]/g, c => "\\" + c).replace(/\n/g, "\\n"); }
const BYDAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const SPREAD = { 1: [1], 2: [1, 4], 3: [1, 3, 5], 4: [0, 2, 4, 6], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6] };
function firstOnOrAfter(k, dl) { for (let i = 0; i < 7; i++) { const d = addDays(k, i); if (dl.includes(parseKey(d).getDay())) return d; } return k; }
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = [];
  for (const m of meds) {
    if (!m.remind || !m.remind.on || !m.schedule) continue;
    const s = m.schedule, t = m.remind.time || "09:00";
    const title = "Take " + m.name + (m.sched ? " (" + m.sched + ")" : "");
    const push = (uid, start, rule, desc) => ev.push(["BEGIN:VEVENT", "UID:" + uid + "@medcalendar", "DTSTAMP:" + stamp, "DTSTART:" + icsDate(start, t), "DURATION:PT15M", "RRULE:" + rule, "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc(desc), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(title), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n"));
    const from = todayKey > (s.since || todayKey) ? todayKey : (s.since || todayKey);
    if (s.type === "daily") push(m.id + "-d", from, "FREQ=DAILY", "Every day");
    else if (s.type === "days") push(m.id + "-w", firstOnOrAfter(from, s.days), "FREQ=WEEKLY;BYDAY=" + s.days.map(d => BYDAY[d]).join(","), schedText(m));
    else if (s.type === "perweek") { const dl = SPREAD[s.perWeek] || [1]; push(m.id + "-p", firstOnOrAfter(from, dl), "FREQ=WEEKLY;BYDAY=" + dl.map(d => BYDAY[d]).join(","), schedText(m) + ", on any days you like"); }
    else if (s.type === "cycle") for (let i = 0; i < s.on; i++) push(m.id + "-c" + i, addDays(s.start, i), "FREQ=DAILY;INTERVAL=" + (s.on + s.off), schedText(m));
  }
  if (!ev.length) return null;
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Medication Calendar//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Medications", ...ev, "END:VCALENDAR", ""].join("\r\n");
}
function exportReminders() {
  const ics = buildICS();
  if (!ics) { setMsg("Turn on a reminder first: tap a medication above, set how often, and check Remind me."); return; }
  downloadText(ics, "medication-reminders.ics", "text/calendar");
  setMsg("Open the file and choose Add All to put the reminders in your Calendar.");
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
renderMain();
</script>
