<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Med Calendar">
<meta name="theme-color" content="#5a4fcf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Medication Calendar</title>
<style>
/* Layout: gradient page; compact top bar, Today card, one-row medication tray, calendar card. Day view and Medications open as sheets over the calendar. */
:root {
  --bg: #ece8fb;
  --bg-end: #f2a98a;
  --bg-grad: linear-gradient(160deg, #5a4fcf 0%, #8a63d2 34%, #c97fb8 68%, #f2a98a 100%);
  --on-bg: #ffffff;
  --on-bg-muted: rgba(255,255,255,.82);
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #667089;
  --line: #e2e5ee;
  --accent: #4b45c8;
  --chip: #f1f0fa;
  --danger: #c23b3b;
  --shadow: 0 4px 18px rgb(30 20 80 / .16);
  --font-display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141226; --bg-end: #4a2445; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%);
    --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75);
    --surface: #1d1f2c; --ink: #e8ebf3; --muted: #9aa2b8; --line: #2f3446; --accent: #9aa2ff; --chip: #262a3a; --danger: #ff7b7b;
    --shadow: 0 4px 18px rgb(0 0 0 / .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141226; --bg-end: #4a2445; --bg-grad: linear-gradient(160deg, #1f1a4d 0%, #36265e 45%, #4a2445 100%);
  --on-bg: #f1eefc; --on-bg-muted: rgba(241,238,252,.75);
  --surface: #1d1f2c; --ink: #e8ebf3; --muted: #9aa2b8; --line: #2f3446; --accent: #9aa2ff; --chip: #262a3a; --danger: #ff7b7b;
  --shadow: 0 4px 18px rgb(0 0 0 / .35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg-end); min-height: 100%; }
html, body { margin: 0; }
body { background: var(--bg-grad); background-color: var(--bg); min-height: 100vh; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right)); padding-block: calc(12px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.45rem, 5.5vw, 2rem); margin: 0; color: var(--on-bg); letter-spacing: -0.01em; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.2); color: var(--on-bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav button { height: 36px; min-width: 36px; border-radius: 999px; border: none; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); cursor: pointer; font-size: 17px; padding: 0 10px; }
.nav .todaybtn { font-size: 14px; font-weight: 600; padding: 0 14px; }
.seg { display: inline-flex; background: rgba(255,255,255,.2); border-radius: 999px; padding: 3px; }
.seg button { border: none; background: transparent; color: var(--on-bg); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); }

/* today card */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.today { padding: 12px 14px; display: grid; gap: 8px; }
.today h2 { margin: 0; font-family: var(--font-display); font-size: .95rem; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; }
.today h2 small { font-family: var(--font-body); color: var(--muted); font-weight: 500; font-size: 12.5px; }
.todaylist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.todaylist .none { grid-column: 1 / -1; }
.todaylist .none { color: var(--muted); font-size: 13.5px; }
.tchip { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 8px; border: 1.5px dashed var(--mc); background: var(--surface); border-radius: 12px; padding: 7px 10px; text-align: left; cursor: pointer; min-width: 0; }
.tchip > :first-child { grid-row: span 2; }
.tchip svg { width: 22px; height: 22px; }
.tchip .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tchip .st { color: var(--muted); font-size: 12px; }
.tchip.done { border-style: solid; background: color-mix(in srgb, var(--mc) 14%, var(--surface)); }
.tchip.done .st { color: var(--mc); font-weight: 700; }

/* tray */
.tray { display: grid; gap: 6px; }
.trayrow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 0 -2px; -webkit-overflow-scrolling: touch; }
.trayrow::-webkit-scrollbar { display: none; }
.stamp { flex: none; display: inline-flex; align-items: center; gap: 6px; border: none; background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer; max-width: 170px; }
.stamp > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stamp svg { width: 20px; height: 20px; flex: none; }
.stamp[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--mc), var(--shadow); background: color-mix(in srgb, var(--mc) 14%, var(--surface)); }
.trayhint { font-size: 12.5px; color: var(--on-bg-muted); min-height: 1.2em; }
.trayhint b { color: var(--on-bg); }

/* marks */
.nick { display: inline-block; font-weight: 800; font-size: 11px; line-height: 1; letter-spacing: .02em; padding: 3px 4px; border-radius: 5px; background: color-mix(in srgb, currentColor 13%, transparent); white-space: nowrap; }
.stamp .nick, .tchip .nick { font-size: 12px; padding: 4px 5px; }
.gw { display: inline-flex; align-items: center; border-radius: 5px; outline: 1.5px dashed currentColor; outline-offset: 1px; opacity: .5; }
.gw.missed { outline-color: var(--danger); opacity: .6; }

/* month grid */
.cal { padding: 8px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow div { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px 0 6px; font-weight: 600; }
.day { min-height: 88px; border: none; border-radius: 10px; background: transparent; text-align: left; padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:active { background: var(--chip); }
@media (hover: hover) { .day:hover { background: var(--chip); } }
.day.blank { visibility: hidden; cursor: default; }
.day .n { font-family: var(--font-display); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; line-height: 1; }
.day.today .n { background: var(--accent); color: var(--surface); }
.icons { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.icons svg { width: 19px; height: 19px; }
.notedot { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.day .note { display: flex; gap: 3px; font-size: 11px; line-height: 1.25; color: var(--muted); min-width: 0; }
.day .note svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.day .note span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
@media (max-width: 520px) {
  .day { min-height: 66px; padding: 3px; }
  .icons svg { width: 15px; height: 15px; }
  .icons .nick { font-size: 9.5px; padding: 2px 3px; }
  .icons { gap: 2px; }
  .day .note span { display: none; }
}

/* week list */
.week { display: grid; }
.wrow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 74px; border: none; background: transparent; text-align: left; padding: 8px 6px; cursor: pointer; border-bottom: 1px solid var(--line); }
.wrow:last-child { border-bottom: none; }
.wrow:active { background: var(--chip); }
.wdate { display: grid; justify-items: center; gap: 2px; }
.wdate small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.wdate b { font-family: var(--font-display); font-size: 22px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.wrow.today .wdate b { background: var(--accent); color: var(--surface); }
.wbody { display: grid; gap: 5px; min-width: 0; }
.wbody .icons { gap: 6px; }
.wbody .icons svg { width: 28px; height: 28px; }
.wbody .icons .nick { font-size: 14px; padding: 5px 7px; }
.wbody .note { font-size: 13px; color: var(--muted); display: flex; gap: 5px; }
.wbody .note svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.wbody .empty { color: var(--muted); font-size: 13px; }

.key { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-bg-muted); }
.key .gw { color: var(--on-bg); margin-left: 4px; }
.key .gw svg { width: 15px; height: 15px; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgb(20 14 50 / .45); z-index: 20; opacity: 0; transition: opacity .18s; }
.backdrop.show { opacity: 1; }
.sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: min(100%, 560px); max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 30px rgb(20 14 50 / .3); padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
.sheet.show { transform: translate(-50%, 0); }
.sheet.zoom { top: 50%; bottom: auto; width: min(calc(100% - 24px), 480px); border-radius: 20px; max-height: 84vh; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s; padding-bottom: 18px; }
.sheet.zoom.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
@media (min-width: 700px) { .sheet:not(.zoom) { bottom: auto; top: 50%; border-radius: 20px; transform: translate(-50%, -45%); opacity: 0; transition: transform .2s, opacity .18s; } .sheet:not(.zoom).show { transform: translate(-50%, -50%); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet.zoom, .backdrop { transition: none; } }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.shead h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.shead .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.xbtn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--chip); cursor: pointer; display: grid; place-items: center; flex: none; }
.xbtn svg { width: 16px; height: 16px; }
.backbtn { border: none; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* day view rows */
.drows { display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; }
.drow .mk { display: grid; place-items: center; }
.drow .mk svg { width: 32px; height: 32px; }
.drow .mk .nick { font-size: 14px; padding: 5px 6px; }
.drow b { display: block; font-weight: 600; }
.drow small { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; border: 1.5px dashed var(--line); color: var(--muted); }
.pill.due { border-color: var(--mc); color: var(--ink); }
.pill.missed { border-color: var(--danger); color: var(--danger); }
.drow.taken { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 10%, var(--surface)); }
.drow.taken .pill { border: none; background: var(--mc); color: #fff; }
.dnote { display: grid; gap: 6px; margin-top: 14px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
textarea, .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
.sfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger.confirm { background: var(--danger); color: var(--surface); }
.delbox { margin-top: 14px; padding: 14px; border: 1.5px solid var(--danger); border-radius: 14px; }
.delbox[hidden] { display: none; }
.delbox b { color: var(--danger); }
.delbox p { margin: 6px 0 0; font-size: 14px; }
.delbox .muted { color: var(--muted); }
.empty-note { color: var(--muted); font-size: 14px; }

/* manage list */
.mlist { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; width: 100%; }
.mrow .mk svg { width: 28px; height: 28px; }
.mrow b { display: block; font-weight: 600; }
.mrow small { color: var(--muted); font-size: 12.5px; }
.mrow .chev { color: var(--muted); font-size: 20px; }

/* first-run tour */
.sheet.tour { width: min(calc(100% - 24px), 420px); }
.tstage { position: relative; height: 216px; border-radius: 16px; background: var(--bg-grad); overflow: hidden; }
.tscreen { position: absolute; left: 50%; top: 50%; width: 260px; height: 190px; margin: -95px 0 0 -130px; }
.tscreen > * { position: absolute; }
.tbox { background: var(--surface); border-radius: 12px; box-shadow: 0 3px 12px rgb(20 14 50 / .22); }
.tt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.trow { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 600; background: var(--surface); }
.trow svg { width: 18px; height: 18px; flex: none; }
.tsite { display: grid; place-items: center; height: 30px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface); }
.tfinger { width: 26px; height: 26px; border-radius: 50%; background: rgb(255 255 255 / .55); border: 2px solid #fff; box-shadow: 0 2px 8px rgb(20 14 50 / .35); z-index: 3; pointer-events: none; }
.th { margin: 16px 0 6px; font-family: var(--font-display); font-size: 1.2rem; }
.tp { margin: 0; color: var(--muted); font-size: 14.5px; min-height: 84px; }
.tdots { display: flex; justify-content: center; gap: 7px; margin: 12px 0 4px; }
.tdots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: none; background: var(--line); cursor: pointer; }
.tdots button[aria-current="step"] { background: var(--accent); width: 22px; border-radius: 999px; }
.tnav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.tnav .skip { border: none; background: none; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 4px; }

/* step 1: calendar fills in */
.t1 { left: 7px; top: 22px; padding: 10px; display: grid; grid-template-columns: repeat(7, 28px); gap: 5px; }
.t1 i { width: 28px; height: 28px; border-radius: 7px; background: var(--chip); display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--muted); }
.t1 i svg { width: 18px; height: 18px; animation: tpop 5s infinite both; animation-delay: calc(var(--i) * .1s); }
.t1 .td { outline: 2px solid var(--accent); }
@keyframes tpop { 0% { transform: scale(0); } 7% { transform: scale(1.25); } 11%, 88% { transform: scale(1); } 95%, 100% { transform: scale(0); } }

/* step 2: add a medication */
.t2a, .t2b { left: 0; top: 0; width: 260px; height: 190px; padding: 12px; }
.t2a { animation: t2a 7s infinite; opacity: 0; }
.t2b { animation: t2b 7s infinite; }
.t2a .trow { position: absolute; left: 12px; right: 12px; }
.t2add { color: var(--accent); animation: t2hl 7s infinite; }
@keyframes t2a { 0%, 31% { opacity: 1; transform: none; } 37%, 95% { opacity: 0; transform: translateX(-24px); } 100% { opacity: 1; transform: none; } }
@keyframes t2b { 0%, 31% { opacity: 0; transform: translateX(24px); } 38%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes t2hl { 0%, 19% { background: var(--surface); } 22%, 32% { background: var(--chip); } }
.tfield { position: absolute; left: 12px; right: 12px; height: 30px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; padding: 0 9px; font-size: 13px; }
.ttype { display: inline-block; overflow: hidden; white-space: nowrap; max-width: 9em; animation: ttype 7s infinite steps(14); }
@keyframes ttype { 0%, 40% { max-width: 0; } 54%, 100% { max-width: 9em; } }
.t2icons { position: absolute; left: 12px; top: 76px; display: flex; gap: 8px; }
.t2icons i { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; }
.t2icons i svg { width: 18px; height: 18px; }
.tring { position: absolute; left: 50px; top: 74px; width: 34px; height: 34px; border: 2.5px solid var(--accent); border-radius: 10px; animation: tring 7s infinite; }
@keyframes tring { 0%, 59% { opacity: 0; transform: scale(1.4); } 62%, 100% { opacity: 1; transform: none; } }
.tsave { position: absolute; right: 12px; top: 152px; width: 68px; height: 28px; border-radius: 999px; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
.f2 { animation: f2 7s infinite; opacity: 0; }
@keyframes f2 {
  0% { left: 220px; top: 170px; opacity: 0; transform: none; } 8% { opacity: 1; }
  20% { left: 117px; top: 89px; transform: none; } 23% { transform: scale(.75); } 26% { left: 117px; top: 89px; transform: none; }
  52% { left: 52px; top: 78px; transform: none; } 58% { left: 52px; top: 78px; transform: none; } 60% { transform: scale(.75); } 63% { transform: none; }
  76% { left: 201px; top: 153px; transform: none; } 79% { transform: scale(.75); } 82% { left: 201px; top: 153px; transform: none; opacity: 1; } 90%, 100% { left: 201px; top: 153px; opacity: 0; } }

/* step 3: mark a dose */
.t3today { left: 0; top: 0; width: 260px; height: 72px; padding: 9px 12px; }
.t3today .trow { position: absolute; left: 12px; right: 12px; top: 30px; }
.tpill { position: absolute; right: 8px; top: 6px; width: 58px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; }
.tpill.due { border: 1.5px dashed #8a4fd0; color: var(--ink); animation: tout 6s infinite; opacity: 0; }
.tpill.done { background: #8a4fd0; color: #fff; animation: tin 6s infinite; }
@keyframes tout { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
@keyframes tin { 0%, 23% { opacity: 0; transform: scale(.6); } 27% { opacity: 1; transform: scale(1.12); } 30%, 100% { opacity: 1; transform: none; } }
.t3tray { left: 0; top: 82px; display: flex; gap: 8px; }
.t3tray i { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: 0 2px 6px rgb(20 14 50 / .2); }
.t3tray i svg { width: 18px; height: 18px; }
.t3sel { outline: 2.5px solid var(--accent); outline-offset: 2px; animation: tsel 6s infinite; }
@keyframes tsel { 0%, 47% { outline-color: transparent; } 49%, 100% { outline-color: var(--accent); } }
.t3cal { left: 0; top: 126px; width: 260px; height: 60px; padding: 12px; display: flex; gap: 4px; }
.t3cal i { width: 32px; height: 36px; border-radius: 7px; background: var(--chip); display: grid; place-items: center; font-style: normal; }
.t3cal i svg { width: 18px; height: 18px; }
.t3stamp svg { animation: tstamp 6s infinite; }
@keyframes tstamp { 0%, 70% { transform: scale(0); } 73% { transform: scale(1.3); } 76%, 100% { transform: none; } }
.f3 { animation: f3 6s infinite; opacity: 0; }
@keyframes f3 {

    if (st.weeks && st.weeks.length) L.push(`  Weekly goal met: ${st.weeks.filter(w => w.c >= w.t).length} of ${st.weeks.length} weeks`);
    if (st.amts.length) L.push(`  Dose: ${st.amts.map(a => a.v + (st.amts.length > 1 ? " from " + fmtShort(a.k) : "")).join(", ")}`);
    if (Object.keys(st.sites).length) L.push(`  Sites: ${Object.entries(st.sites).map(([s, n]) => s + " x" + n).join(", ")}`);
    L.push("");
  }
  const rdl = rdSummaryLines(summaryData(y, mo).rd);
  if (rdl.length) { L.push("Readings"); for (const [a, b] of rdl) L.push(`  ${a}: ${b}`); L.push(""); }
  if (notes.length) { L.push("Notes"); for (const n of notes) L.push(`  ${fmtShort(n.k)}: ${n.t}`); }
  return L.join("\n");
}
async function shareSummary() {
  const d = parseKey(sheetArg), text = summaryText(d.getFullYear(), d.getMonth());
  try { if (navigator.share) { await navigator.share({ title: "Medication summary", text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Summary copied"); } catch (e) { toast("Couldn't share on this device"); }
}

// ----- sheet events -----
sheet.addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest("[data-close]")) { closeSheet(); return; }
  if (t.closest("[data-back]")) { go("manage"); return; }
  if (sheetKind === "day") {
    const ra = t.closest("[data-rdadd]"); if (ra) { flushNote(); go("reading", { k: sheetArg, type: ra.dataset.rdadd, from: "day" }); return; }
    const re = t.closest("[data-rdedit]"); if (re) { flushNote(); go("reading", { k: sheetArg, type: re.dataset.rdedit, i: re.dataset.i != null ? +re.dataset.i : null, from: "day" }); return; }
    const s = t.closest("[data-site]");
    if (s) { const d = days[sheetArg].meds[s.dataset.smed]; d.site = d.site === s.dataset.site ? "" : s.dataset.site; save(true); toast("Site saved"); renderDaySheet(sheetArg); renderMain(); return; }
    const r = t.closest("[data-dmed]");
    if (r) { flushNote(); stepDose(r.dataset.dmed, sheetArg, { after: () => { if (sheetKind === "day") renderDaySheet(sheetArg); } }); }
    return;
  }
  if (sheetKind === "manage") {
    const e = t.closest("[data-edit]");
    if (e) { go("edit", e.dataset.edit || null); return; }
    if (t.closest("#summaryBtn")) { go("summary", null); return; }
    if (t.closest("#tourBtn")) { startTour(); return; }
    if (t.closest("#trendsBtn")) { go("trends"); return; }
    const un = t.closest("[data-unit]"); if (un) { track.unit = un.dataset.unit; save(true); renderManage(); renderMain(); return; }
    if (t.closest("#backupBtn")) { saveBackup(); return; }
    return;
  }
  if (sheetKind === "reading") {
    const a = sheetArg;
    if (t.closest("#rSave")) { rdSave(a); return; }
    if (t.closest("#rDel")) { rdDelete(a); return; }
    if (t.closest("#rCancel")) { rdBack(a); return; }
    const oi = t.closest("[data-rdi]"); if (oi) { go("reading", Object.assign({}, a, { i: +oi.dataset.rdi })); return; }
    return;
  }
  if (sheetKind === "trends") {
    const tr = t.closest("[data-tr]"); if (tr) { trendDays = +tr.dataset.tr; renderTrends(); return; }
    const ra = t.closest("[data-rdadd]"); if (ra) { go("reading", { k: todayKey, type: ra.dataset.rdadd, from: "trends" }); return; }
    const re = t.closest("[data-rdedit]"); if (re) { go("reading", { k: re.dataset.k, type: re.dataset.rdedit, i: re.dataset.i != null ? +re.dataset.i : null, from: "trends" }); return; }
    return;
  }
  if (sheetKind === "tour") {
    const st = t.closest("[data-tstep]"); if (st) { tourGo(tourStep + +st.dataset.tstep); return; }
    const dt = t.closest("[data-tdot]"); if (dt) { tourGo(+dt.dataset.tdot); return; }
    if (t.closest("#tourAdd")) { closeSheet(); setTimeout(() => openSheet("edit", null), 260); return; }
    return;
  }
  if (sheetKind === "summary") {
    const n = t.closest("[data-sm]");
    if (n) { const d = parseKey(sheetArg); renderSummary(keyOf(new Date(d.getFullYear(), d.getMonth() + +n.dataset.sm, 1))); return; }
    if (t.closest("#shareSum")) shareSummary();
    return;
  }
  if (sheetKind === "edit") {
    const d = t.closest("[data-dow]"); if (d) { const i = +d.dataset.dow; ed.days = ed.days.includes(i) ? ed.days.filter(x => x !== i) : [...ed.days, i]; edRefresh(); return; }
    const sh = t.closest("[data-shape]"); if (sh) { ed.shape = sh.dataset.shape; edRefresh(); return; }
    const co = t.closest("[data-color]"); if (co) { ed.color = co.dataset.color; edRefresh(); return; }
    const sw = t.closest("[data-show]"); if (sw && !sw.disabled) { ed.show = sw.dataset.show; edRefresh(); return; }
    if (t.closest("#edSave")) { edSave(); return; }
    if (t.closest("#edArchive")) {
      const m = medById(ed.id); m.archived = true; if (activeMed === m.id) activeMed = null;
      save(true); renderMain(); toast(`Archived ${m.name}`, () => { m.archived = false; save(true); renderMain(); if (sheetKind === "manage") renderManage(); });
      go("manage"); return;
    }
    if (t.closest("#edRestore")) { medById(ed.id).archived = false; save(); go("manage"); return; }
    const cb = document.getElementById("edConfirm");
    if (t.closest("#edDelete")) { cb.hidden = false; cb.scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
    if (t.closest("#edDelNo")) { cb.hidden = true; return; }
    if (t.closest("#edDelYes")) {
      const name = medById(ed.id).name;
      if (activeMed === ed.id) activeMed = null;
      meds = meds.filter(m => m.id !== ed.id);
      for (const k of Object.keys(days)) { if (days[k].meds) { delete days[k].meds[ed.id]; if (!hasContent(days[k])) delete days[k]; } }
      save(true); renderMain(); go("manage"); toast(`Deleted ${name}`);
    }
  }
});
sheet.addEventListener("keydown", ev => { if (sheetKind === "reading" && ev.key === "Enter" && ev.target.tagName === "INPUT") { ev.preventDefault(); rdSave(sheetArg); } });
sheet.addEventListener("input", ev => {
  if (sheetKind === "day" && ev.target.id === "dNote") { clearTimeout(noteTimer); noteTimer = setTimeout(flushNote, 700); }
  if (sheetKind === "edit" && (ev.target.id === "edName" || ev.target.id === "edNick")) edRefresh();
});
sheet.addEventListener("change", ev => {
  const t = ev.target;
  if (sheetKind === "edit" && ["edFreq", "edPerDay", "edTrack"].includes(t.id)) edRefresh();
  if (sheetKind === "manage" && t.id === "restoreFile") restoreBackup(t);
  if (sheetKind === "manage" && (t.id === "trBp" || t.id === "trWt")) { track[t.id === "trBp" ? "bp" : "wt"] = t.checked; save(true); renderManage(); renderMain(); }
  if (sheetKind === "day" && t.dataset.amt) { const d = dose(medById(t.dataset.amt), sheetArg); if (d) { d.amt = t.value.trim(); save(true); toast("Dose saved"); } }
});

// ---------- backup ----------
function backupDone(msg) { prefs.lastBackup = todayKey; prefs.snooze = null; savePrefs(); setMsg(msg); renderBanners(); toast(msg); }
async function saveBackup() {
  const text = JSON.stringify({ version: 2, days, meds, track }, null, 2);
  const name = "medication-log-" + todayKey + ".json";
  try {
    const file = new File([text], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Medication log backup" }); backupDone("Backup ready. Save it to Files or send it to yourself."); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  downloadText(text, name, "application/json");
  backupDone("Backup saved to Downloads.");
}
function restoreBackup(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result); if (!data || typeof data !== "object") throw 0;
      meds = []; days = {}; track = Object.assign({}, TRACK0); loadFrom(data); activeMed = null;
      if (!data.track) { for (const e of Object.values(days)) { if (e.rd && e.rd.bp) track.bp = true; if (e.rd && e.rd.wt) { track.wt = true; track.unit = e.rd.wt.u || "lb"; } } }
      save(); renderSheet(); setMsg("Backup restored.");
    } catch (e) { setMsg("That file isn't a medication calendar backup."); }
    input.value = "";
  };
  r.readAsText(f);
}
function downloadText(text, name, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ---------- calendar reminders ----------
function icsDate(k, time) { return k.replace(/-/g, "") + "T" + time.replace(":", "") + "00"; }
function icsEsc(t) { return String(t).replace(/[\\;,]/g, c => "\\" + c).replace(/\n/g, "\\n"); }
const BYDAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const SPREAD = { 1: [1], 2: [1, 4], 3: [1, 3, 5], 4: [0, 2, 4, 6], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6] };
function firstOnOrAfter(k, dl) { for (let i = 0; i < 7; i++) { const d = addDays(k, i); if (dl.includes(parseKey(d).getDay())) return d; } return k; }
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = [];
  for (const m of activeMeds()) {
    if (!m.remind || !m.remind.on || !m.schedule) continue;
    const s = m.schedule;
    remTimes(m).forEach((t, ti) => {
      const title = "Take " + m.name + (m.sched ? " (" + m.sched + ")" : "");
      const push = (uid, start, rule, desc) => ev.push(["BEGIN:VEVENT", "UID:" + uid + "-t" + ti + "@medcalendar", "DTSTAMP:" + stamp, "DTSTART:" + icsDate(start, t), "DURATION:PT15M", "RRULE:" + rule, "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc(desc), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(title), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n"));
      const from = todayKey > (s.since || todayKey) ? todayKey : (s.since || todayKey);
      if (s.type === "daily") push(m.id + "-d", from, "FREQ=DAILY", "Every day");
      else if (s.type === "days") push(m.id + "-w", firstOnOrAfter(from, s.days), "FREQ=WEEKLY;BYDAY=" + s.days.map(d => BYDAY[d]).join(","), schedText(m));
      else if (s.type === "perweek") { const dl = SPREAD[s.perWeek] || [1]; push(m.id + "-p", firstOnOrAfter(from, dl), "FREQ=WEEKLY;BYDAY=" + dl.map(d => BYDAY[d]).join(","), schedText(m) + ", on any days you like"); }
      else if (s.type === "cycle") for (let i = 0; i < s.on; i++) push(m.id + "-c" + i, addDays(s.start, i), "FREQ=DAILY;INTERVAL=" + (s.on + s.off), schedText(m));
    });
  }
  if (!ev.length) return null;
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Medication Calendar//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Medications", ...ev, "END:VCALENDAR", ""].join("\r\n");
}
function exportReminders() {
  const ics = buildICS();
  if (!ics) { setMsg("Turn on a reminder first: tap a medication above, set how often, and check Remind me."); return; }
  downloadText(ics, "medication-reminders.ics", "text/calendar");
  prefs.remSig = remSig(); savePrefs();
  setMsg("Open the file and choose Add All to put the reminders in your Calendar.");
  renderManage(); renderBanners();
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
renderMain();
if (!prefs.tourSeen && !meds.length && !Object.keys(days).length) setTimeout(() => { if (!sheetKind) startTour(); }, 500);
</script>
